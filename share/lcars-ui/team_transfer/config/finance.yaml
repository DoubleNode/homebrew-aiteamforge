# Team transfer configuration: Finance (personal)
#
# Placeholder tokens resolved at runtime by load_team_config():
#   {home}  — Path.home() as POSIX string
#   {root}  — home_relative_root value (no leading slash)
#   {team}  — team name

team: finance
home_relative_root: "finance/personal"

# Board filename and kanban ticket prefix (used by domain_kanban + verifier).
board_filename: "finance-personal-board.json"
ticket_prefix: "XFIN-"

# Claude project directory name under ~/.claude/projects/.
# Derived value: -Users-<user>-<home_relative_root with / replaced by ->
# Override here if the derivation doesn't match what Claude Code created.
claude_project_dir_name: "-Users-darrenehlers-finance-personal"

# SQLite databases to probe for structural integrity.
databases:
  - path: "{home}/{root}/data/finance.db"
    cls: schema

# Default channel rules. Order: more-specific AFTER more-general (later rules win).
# These reproduce the hardcoded defaults from the original finance_platform.migration
# channels.py exactly (back-compat boundary for XACA-0495).
defaults:
  rules:
    # ----- AITEAMFORGE_PRODUCT: installer-owned product files (AITeamForge ships these) -----
    - pattern: "{home}/dev-team/{team}/*"
      channel: aiteamforge_product
    - pattern: "{home}/dev-team/{team}/**"
      channel: aiteamforge_product
    - pattern: "{home}/finance/.claude/agents/*"
      channel: aiteamforge_product
    - pattern: "{home}/finance/.claude/agents/**"
      channel: aiteamforge_product

    # ----- USER_STATE: Claude memory/session logs + authored knowledge (user-owned) -----
    - pattern: "{home}/.claude/projects/{claude_project_dir_name}/*"
      channel: user_state
    - pattern: "{home}/.claude/projects/{claude_project_dir_name}/**"
      channel: user_state
    - pattern: "{home}/knowledge/agents/quark/*"
      channel: user_state
    - pattern: "{home}/knowledge/agents/quark/**"
      channel: user_state
    - pattern: "{home}/knowledge/agents/nog/*"
      channel: user_state
    - pattern: "{home}/knowledge/agents/nog/**"
      channel: user_state
    - pattern: "{home}/knowledge/agents/brunt/*"
      channel: user_state
    - pattern: "{home}/knowledge/agents/brunt/**"
      channel: user_state
    - pattern: "{home}/knowledge/agents/rom/*"
      channel: user_state
    - pattern: "{home}/knowledge/agents/rom/**"
      channel: user_state
    - pattern: "{home}/knowledge/agents/zek/*"
      channel: user_state
    - pattern: "{home}/knowledge/agents/zek/**"
      channel: user_state

    # ----- GIT: anything tracked under the repo working tree -----
    # NOTE: domain_git decides per-file whether something is tracked; this rule covers
    # the *repo root* as a fallback. domain_git overrides this for gitignored files
    # (DB -> export_database, .env -> secrets_export, sensitive docs -> icloud_excluded).
    - pattern: "{home}/{root}/*"
      channel: git
    - pattern: "{home}/{root}/**"
      channel: git

    # ----- EXPORT_KANBAN: kanban tree (fully gitignored) + project state -----
    - pattern: "{home}/{root}/kanban/*"
      channel: export_kanban
    - pattern: "{home}/{root}/kanban/**"
      channel: export_kanban
    - pattern: "{home}/{root}/worktrees/*"
      channel: export_kanban
    - pattern: "{home}/{root}/worktrees/**"
      channel: export_kanban

    # ----- EXPORT_DATABASE: SQLite databases (require explicit scp/rsync + SCHEMA verify) -----
    - pattern: "{home}/{root}/data/*"
      channel: export_database
    - pattern: "{home}/{root}/data/**"
      channel: export_database

    # ----- SECRETS_EXPORT: env files, credential files, secrets/ directory -----
    - pattern: "{home}/{root}/.env"
      channel: secrets_export
    - pattern: "{home}/{root}/.env.*"
      channel: secrets_export
    - pattern: "{home}/{root}/**/.env"
      channel: secrets_export
    - pattern: "{home}/{root}/**/.env.*"
      channel: secrets_export
    - pattern: "{home}/{root}/secrets/*"
      channel: secrets_export
    - pattern: "{home}/{root}/secrets/**"
      channel: secrets_export

    # ----- ICLOUD_EXCLUDED: sensitive docs archived to iCloud -----
    # These paths SHOULD NOT exist locally (deleted 2026-05-05). If a future re-sync
    # restores them, the audit silently skips them.
    - pattern: "{home}/{root}/docs/statements/**"
      channel: icloud_excluded
    - pattern: "{home}/{root}/docs/paystubs/**"
      channel: icloud_excluded

  icloud_excluded: []

# User override slot — list of {pattern, channel} maps layered on top of defaults (later rules win).
# Entries here layer on top of defaults (later rules win).
overrides: []
