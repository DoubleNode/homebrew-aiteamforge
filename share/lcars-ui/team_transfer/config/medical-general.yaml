# Team transfer configuration: Medical (General)
#
# Placeholder tokens resolved at runtime by load_team_config():
#   {home}  — Path.home() as POSIX string
#   {root}  — home_relative_root value (no leading slash)
#   {team}  — team name
#
# HIPAA note: This repo contains medical records and PHI. The repo is
# git-tracked (~/medical/general/.git exists), so domain_git handles
# per-file routing. Files excluded via .gitignore are routed to the
# appropriate channel (secrets_export or icloud_excluded) rather than git.
# No special override rules are required here beyond standard patterns.

team: medical-general
home_relative_root: "medical/general"
# product_dir: bare directory NAME under ~/dev-team/ that holds this team's
# product assets (personas, logos, board data). Differs from 'team' (medical-general)
# -- see lcars-ui/server.py team_dir_map (XACA-0954-002).
product_dir: "medical"
# personas: this team's actual persona set (knowledge DIRECTORY names, since
# domain_knowledge globs ~/knowledge*/agents/<persona>/). Required key -- absent
# is a hard gap (XACA-0954-004). Source of truth: ~/dev-team/.claude/agents-master/medical/ (6 personas); dirs resolve under ~/knowledge-local/agents/ (XACA-0754 PII isolation).
personas:
  - "cameron"
  - "chase"
  - "cuddy"
  - "foreman"
  - "house"
  - "wilson"

# persona_dirs: extra directories walked by domain_devteam in addition to
# product_dir. medical-general is the ONLY team with an above-root persona tree:
# ~/medical/personas/ sits one level ABOVE home_relative_root ("medical/general"),
# so no rule reached it and no domain walked it. It was not even reported as an
# untagged gap, because "untagged" only counts files the scan actually reached --
# 46 files / 6.0MB (avatars incl. _panel/_thumb variants + 6 terminal logos)
# silently absent from every export (XACA-0954-005).
persona_dirs:
  - "{home}/medical/personas"

# Board filename and kanban ticket prefix (used by domain_kanban + verifier).
board_filename: "medical-general-board.json"
ticket_prefix: "XMED-"

# Claude project directory name under ~/.claude/projects/.
# Derived value: -Users-<user>-<home_relative_root with / replaced by ->
# Override here if the derivation doesn't match what Claude Code created.
claude_project_dir_name: "-Users-darrenehlers-medical-general"

# SQLite databases to probe for structural integrity.
# (none for this team — add entries as "- path: ...\n  cls: schema" if a DB is added later)
databases:

# Default channel rules. Order: more-specific AFTER more-general (later rules win).
defaults:
  rules:
    # ----- AITEAMFORGE_PRODUCT: installer-owned product files (AITeamForge ships these) -----
    - pattern: "{home}/dev-team/{team}/*"
      channel: aiteamforge_product
    - pattern: "{home}/dev-team/{team}/**"
      channel: aiteamforge_product
    - pattern: "{home}/medical/.claude/agents/*"
      channel: aiteamforge_product
    - pattern: "{home}/medical/.claude/agents/**"
      channel: aiteamforge_product
    # Above-root persona tree (see persona_dirs above). Tagged explicitly rather
    # than leaning on domain_devteam's UNTAGGED->aiteamforge_product safety net,
    # so the routing is auditable in the config (XACA-0954-005).
    - pattern: "{home}/medical/personas/*"
      channel: aiteamforge_product
    - pattern: "{home}/medical/personas/**"
      channel: aiteamforge_product

    # ----- USER_STATE: Claude memory/session logs + authored knowledge (user-owned) -----
    - pattern: "{home}/.claude/projects/{claude_project_dir_name}/*"
      channel: user_state
    - pattern: "{home}/.claude/projects/{claude_project_dir_name}/**"
      channel: user_state

    # ----- GIT: anything tracked under the repo working tree -----
    # NOTE: domain_git decides per-file whether something is tracked; this rule covers
    # the *repo root* as a fallback. domain_git overrides this for gitignored files
    # (DB -> export_database, .env -> secrets_export, sensitive docs -> icloud_excluded).
    # PHI/medical records are git-tracked in this repo; domain_git applies per-file
    # exclusion for anything the .gitignore marks as excluded.
    - pattern: "{home}/{root}/*"
      channel: git
    - pattern: "{home}/{root}/**"
      channel: git

    # ----- EXPORT_KANBAN: kanban tree (fully gitignored) + project state -----
    - pattern: "{home}/{root}/kanban/*"
      channel: export_kanban
    - pattern: "{home}/{root}/kanban/**"
      channel: export_kanban
    - pattern: "{home}/{root}/worktrees/*"
      channel: export_kanban
    - pattern: "{home}/{root}/worktrees/**"
      channel: export_kanban

    # ----- SECRETS_EXPORT: env files, credential files, secrets/ directory -----
    - pattern: "{home}/{root}/.env"
      channel: secrets_export
    - pattern: "{home}/{root}/.env.*"
      channel: secrets_export
    - pattern: "{home}/{root}/**/.env"
      channel: secrets_export
    - pattern: "{home}/{root}/**/.env.*"
      channel: secrets_export
    - pattern: "{home}/{root}/secrets/*"
      channel: secrets_export
    - pattern: "{home}/{root}/secrets/**"
      channel: secrets_export

    # ----- ICLOUD_EXCLUDED: sensitive docs archived to iCloud -----
    # No subdirectories currently archived to iCloud for this team.
    # Add entries here if any medical record subdirs are moved to iCloud-only storage.

  icloud_excluded: []

# User override slot — list of {pattern, channel} maps layered on top of defaults (later rules win).
overrides: []
