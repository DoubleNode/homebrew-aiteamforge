# Team transfer configuration: Firebase (MainEventApp-Functions)
#
# Placeholder tokens resolved at runtime by load_team_config():
#   {home}  — Path.home() as POSIX string
#   {root}  — home_relative_root value (no leading slash)
#   {team}  — team name
#   {claude_project_dir_name} — Claude project slug
#
# NOTE: This repo lives under /Users/Shared/, NOT under $HOME. Using Option B:
# home_relative_root is empty and patterns that reference the repo root use
# absolute paths directly, since fnmatch compares strings without Path.resolve().

team: firebase
# Repo root: /Users/Shared/Development/Main Event/MainEventApp-Functions
# Pass --repo-root to generator explicitly for this team.
home_relative_root: ""
# product_dir: bare directory NAME under ~/dev-team/ that holds this team's
# product assets (personas, logos, board data). Matches 'team' here.
product_dir: "firebase"
# personas: this team's actual persona set (knowledge DIRECTORY names, since
# domain_knowledge globs ~/knowledge*/agents/<persona>/). Required key -- absent
# is a hard gap (XACA-0954-004). Source of truth: ~/dev-team/.claude/agents-master/firebase/ (7 personas).
personas:
  - "bashir"
  - "dax"
  - "kira"
  - "obrien"
  - "odo"
  - "quark"
  - "sisko"



# Board filename and kanban ticket prefix (used by domain_kanban + verifier).
board_filename: "firebase-board.json"
ticket_prefix: "XFIR-"

# Claude project directory name under ~/.claude/projects/.
claude_project_dir_name: "-Users-Shared-Development-Main-Event-MainEventApp-Functions"

# SQLite databases to probe for structural integrity.
# No data/ directory exists in this repo.
databases:

# Default channel rules. Order: more-specific AFTER more-general (later rules win).
defaults:
  rules:
    # ----- AITEAMFORGE_PRODUCT: installer-owned product files (AITeamForge ships these) -----
    # ~/dev-team/firebase/ — scripts and configs AITeamForge ships for the Firebase team.
    - pattern: "{home}/dev-team/{team}/*"
      channel: aiteamforge_product
    - pattern: "{home}/dev-team/{team}/**"
      channel: aiteamforge_product
    # Personas live inside the Shared repo (absolute path required).
    - pattern: "/Users/Shared/Development/Main Event/MainEventApp-Functions/.claude/agents/*"
      channel: aiteamforge_product
    - pattern: "/Users/Shared/Development/Main Event/MainEventApp-Functions/.claude/agents/**"
      channel: aiteamforge_product

    # ----- USER_STATE: Claude memory/session logs + authored knowledge (user-owned) -----
    - pattern: "{home}/.claude/projects/{claude_project_dir_name}/*"
      channel: user_state
    - pattern: "{home}/.claude/projects/{claude_project_dir_name}/**"
      channel: user_state
    - pattern: "{home}/knowledge/agents/bashir/*"
      channel: user_state
    - pattern: "{home}/knowledge/agents/bashir/**"
      channel: user_state
    - pattern: "{home}/knowledge/agents/dax/*"
      channel: user_state
    - pattern: "{home}/knowledge/agents/dax/**"
      channel: user_state
    - pattern: "{home}/knowledge/agents/kira/*"
      channel: user_state
    - pattern: "{home}/knowledge/agents/kira/**"
      channel: user_state
    - pattern: "{home}/knowledge/agents/obrien/*"
      channel: user_state
    - pattern: "{home}/knowledge/agents/obrien/**"
      channel: user_state
    - pattern: "{home}/knowledge/agents/odo/*"
      channel: user_state
    - pattern: "{home}/knowledge/agents/odo/**"
      channel: user_state
    - pattern: "{home}/knowledge/agents/quark/*"
      channel: user_state
    - pattern: "{home}/knowledge/agents/quark/**"
      channel: user_state
    - pattern: "{home}/knowledge/agents/sisko/*"
      channel: user_state
    - pattern: "{home}/knowledge/agents/sisko/**"
      channel: user_state

    # ----- GIT: anything tracked under the repo working tree -----
    # Absolute path required: repo is under /Users/Shared/, not $HOME.
    - pattern: "/Users/Shared/Development/Main Event/MainEventApp-Functions/*"
      channel: git
    - pattern: "/Users/Shared/Development/Main Event/MainEventApp-Functions/**"
      channel: git

    # ----- EXPORT_KANBAN: kanban tree (fully gitignored) + project state -----
    - pattern: "/Users/Shared/Development/Main Event/MainEventApp-Functions/kanban/*"
      channel: export_kanban
    - pattern: "/Users/Shared/Development/Main Event/MainEventApp-Functions/kanban/**"
      channel: export_kanban
    - pattern: "/Users/Shared/Development/Main Event/MainEventApp-Functions/worktrees/*"
      channel: export_kanban
    - pattern: "/Users/Shared/Development/Main Event/MainEventApp-Functions/worktrees/**"
      channel: export_kanban

    # ----- SECRETS_EXPORT: env files, credential files, secrets/ directory, keys.txt -----
    # secrets/ contains env files and Firebase Admin SDK JSON credentials.
    - pattern: "/Users/Shared/Development/Main Event/MainEventApp-Functions/**/.env"
      channel: secrets_export
    - pattern: "/Users/Shared/Development/Main Event/MainEventApp-Functions/**/.env.*"
      channel: secrets_export
    - pattern: "/Users/Shared/Development/Main Event/MainEventApp-Functions/secrets/*"
      channel: secrets_export
    - pattern: "/Users/Shared/Development/Main Event/MainEventApp-Functions/secrets/**"
      channel: secrets_export
    - pattern: "/Users/Shared/Development/Main Event/MainEventApp-Functions/keys.txt"
      channel: secrets_export

  icloud_excluded: []

# User override slot — list of {pattern, channel} maps layered on top of defaults (later rules win).
overrides: []
