# Team transfer configuration: Freelance — Liquidstyle AgentBadges IOS
#
# Placeholder tokens resolved at runtime by load_team_config():
#   {home}  — Path.home() as POSIX string
#   {root}  — home_relative_root value (no leading slash)
#   {team}  — team name
#
# Shared-path note: working_dir is under /Users/Shared/Development/, which is
# outside $HOME. home_relative_root is "" and all repo-scoped patterns use
# absolute paths (Option B) so {home}/{root}/... substitution is not used for
# repo content. Only {home}/... tokens are used for HOME-rooted paths such as
# ~/.claude/projects/ and ~/knowledge/agents/.

team: freelance-liquidstyle-agentbadges-ios
home_relative_root: ""

# Board filename and kanban ticket prefix (used by domain_kanban + verifier).
board_filename: "freelance-liquidstyle-agentbadges-ios-board.json"
ticket_prefix: "XFLI-"

# Claude project directory name under ~/.claude/projects/.
# Actual dir found at: ~/.claude/projects/-Users-Shared-Development-Liquidstyle-AgentBadges-IOS-develop
# Matches the develop-branch checkout path for this client iOS project.
claude_project_dir_name: "-Users-Shared-Development-Liquidstyle-AgentBadges-IOS-develop"

# SQLite databases to probe for structural integrity.
# No data/ directory found in /Users/Shared/Development/Liquidstyle/AgentBadges-IOS/.
databases:

# Default channel rules. Order: more-specific AFTER more-general (later rules win).
defaults:
  rules:
    # ----- USER_STATE: Claude memory/session logs + authored knowledge (user-owned) -----
    - pattern: "{home}/.claude/projects/{claude_project_dir_name}/*"
      channel: user_state
    - pattern: "{home}/.claude/projects/{claude_project_dir_name}/**"
      channel: user_state
    - pattern: "{home}/knowledge/agents/reed/*"
      channel: user_state
    - pattern: "{home}/knowledge/agents/reed/**"
      channel: user_state

    # ----- GIT: anything tracked under the repo working tree -----
    # Repo checkout lives at /Users/Shared/Development/Liquidstyle/AgentBadges-IOS/develop/
    # (client iOS project; not aiteamforge-installed). domain_git handles per-file routing
    # and respects .gitignore (.build/, DerivedData/, Pods/ are excluded there).
    - pattern: "/Users/Shared/Development/Liquidstyle/AgentBadges-IOS/develop/*"
      channel: git
    - pattern: "/Users/Shared/Development/Liquidstyle/AgentBadges-IOS/develop/**"
      channel: git

    # ----- EXPORT_KANBAN: kanban tree (fully gitignored) + worktrees listing -----
    - pattern: "/Users/Shared/Development/Liquidstyle/AgentBadges-IOS/kanban/*"
      channel: export_kanban
    - pattern: "/Users/Shared/Development/Liquidstyle/AgentBadges-IOS/kanban/**"
      channel: export_kanban
    - pattern: "/Users/Shared/Development/Liquidstyle/AgentBadges-IOS/worktrees/*"
      channel: export_kanban
    - pattern: "/Users/Shared/Development/Liquidstyle/AgentBadges-IOS/worktrees/**"
      channel: export_kanban

    # ----- EXPORT_DATABASE: SQLite databases (require explicit scp/rsync + SCHEMA verify) -----
    # No data/ directory currently present — rules kept as structural scaffolding.
    - pattern: "/Users/Shared/Development/Liquidstyle/AgentBadges-IOS/develop/data/*"
      channel: export_database
    - pattern: "/Users/Shared/Development/Liquidstyle/AgentBadges-IOS/develop/data/**"
      channel: export_database

    # ----- SECRETS_EXPORT: env files, credential files, secrets/ directory -----
    - pattern: "/Users/Shared/Development/Liquidstyle/AgentBadges-IOS/develop/.env"
      channel: secrets_export
    - pattern: "/Users/Shared/Development/Liquidstyle/AgentBadges-IOS/develop/.env.*"
      channel: secrets_export
    - pattern: "/Users/Shared/Development/Liquidstyle/AgentBadges-IOS/develop/**/.env"
      channel: secrets_export
    - pattern: "/Users/Shared/Development/Liquidstyle/AgentBadges-IOS/develop/**/.env.*"
      channel: secrets_export
    - pattern: "/Users/Shared/Development/Liquidstyle/AgentBadges-IOS/develop/secrets/*"
      channel: secrets_export
    - pattern: "/Users/Shared/Development/Liquidstyle/AgentBadges-IOS/develop/secrets/**"
      channel: secrets_export

  icloud_excluded: []

# User override slot — list of {pattern, channel} maps layered on top of defaults (later rules win).
# Entries here layer on top of defaults (later rules win).
overrides: []
