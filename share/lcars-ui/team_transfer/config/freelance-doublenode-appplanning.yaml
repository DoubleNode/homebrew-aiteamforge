# Team transfer configuration: Freelance — DoubleNode appPlanning
#
# Placeholder tokens resolved at runtime by load_team_config():
#   {home}  — Path.home() as POSIX string  (e.g. /Users/darrenehlers)
#   {root}  — home_relative_root value (no leading slash)
#   {team}  — team name
#   {claude_project_dir_name} — Claude project dir slug
#
# SHARED-PATH NOTE (Option B — absolute paths):
# working_dir is /Users/Shared/Development/DoubleNode/appPlanning, which cannot be
# expressed as {home}/{root}.  All pattern rules below use absolute paths directly.
# home_relative_root uses a ../ trick so the generator's default repo_root resolves
# correctly without needing --repo-root; token {root} is NOT used in any rule here.

team: freelance-doublenode-appplanning
home_relative_root: "../Shared/Development/DoubleNode/appPlanning"

# Board filename and kanban ticket prefix (used by domain_kanban + verifier).
board_filename: "freelance-doublenode-appplanning-board.json"
ticket_prefix: "XFAP-"

# Claude project directory name under ~/.claude/projects/.
# Discovered via: ls ~/.claude/projects/ | grep -i appplanning
claude_project_dir_name: "-Users-Shared-Development-DoubleNode-appPlanning-develop"

# SQLite databases to probe for structural integrity.
# No data/ directory found under working_dir — list is empty.
# NOTE: Use bare section key (no inline []) — the custom YAML parser treats
# "databases: []" as a string, not an empty list. Bare "databases:" with no
# items under it leaves the default empty list intact.
databases:

# Default channel rules. Order: more-specific AFTER more-general (later rules win).
# Client-owned repo: no aiteamforge_product rules (installer does not manage this repo).
defaults:
  rules:
    # ----- USER_STATE: Claude memory/session logs + authored knowledge (user-owned) -----
    - pattern: "{home}/.claude/projects/{claude_project_dir_name}/*"
      channel: user_state
    - pattern: "{home}/.claude/projects/{claude_project_dir_name}/**"
      channel: user_state

    # ----- GIT: anything tracked under the repo working tree -----
    # NOTE: domain_git decides per-file whether something is tracked; this rule covers
    # the *repo root* as a fallback. domain_git overrides this for gitignored files
    # (DB -> export_database, .env -> secrets_export).
    # Absolute path required: {home}/../Shared/... resolves to an unresolved '..' path
    # that fnmatch cannot match. Use literal absolute path (Option B).
    - pattern: "/Users/Shared/Development/DoubleNode/appPlanning/*"
      channel: git
    - pattern: "/Users/Shared/Development/DoubleNode/appPlanning/**"
      channel: git

    # ----- EXPORT_KANBAN: kanban tree (fully gitignored) + project state -----
    - pattern: "/Users/Shared/Development/DoubleNode/appPlanning/kanban/*"
      channel: export_kanban
    - pattern: "/Users/Shared/Development/DoubleNode/appPlanning/kanban/**"
      channel: export_kanban
    - pattern: "/Users/Shared/Development/DoubleNode/appPlanning/worktrees/*"
      channel: export_kanban
    - pattern: "/Users/Shared/Development/DoubleNode/appPlanning/worktrees/**"
      channel: export_kanban

    # ----- EXPORT_DATABASE: SQLite databases (require explicit scp/rsync + SCHEMA verify) -----
    - pattern: "/Users/Shared/Development/DoubleNode/appPlanning/data/*"
      channel: export_database
    - pattern: "/Users/Shared/Development/DoubleNode/appPlanning/data/**"
      channel: export_database

    # ----- SECRETS_EXPORT: env files, credential files, secrets/ directory -----
    - pattern: "/Users/Shared/Development/DoubleNode/appPlanning/.env"
      channel: secrets_export
    - pattern: "/Users/Shared/Development/DoubleNode/appPlanning/.env.*"
      channel: secrets_export
    - pattern: "/Users/Shared/Development/DoubleNode/appPlanning/**/.env"
      channel: secrets_export
    - pattern: "/Users/Shared/Development/DoubleNode/appPlanning/**/.env.*"
      channel: secrets_export
    - pattern: "/Users/Shared/Development/DoubleNode/appPlanning/secrets/*"
      channel: secrets_export
    - pattern: "/Users/Shared/Development/DoubleNode/appPlanning/secrets/**"
      channel: secrets_export

  icloud_excluded: []

# User override slot — list of {pattern, channel} maps layered on top of defaults (later rules win).
overrides: []
