# This file is the tracked source for ~/.tmux.conf.
# Symlinked by deploy-to-production.sh during machine setup.
# Edits here take effect after: tmux source-file ~/.tmux.conf

# Enable mouse support
set -g mouse on

# Disable automatic window renaming
set-option -g allow-rename off
set-window-option -g automatic-rename off

# Let tmux set a simple terminal title based on session name only
set-option -g set-titles on
set-option -g set-titles-string "#S"

# Add to your tmux.conf for easier copying
# Use vi-style keys in copy mode
setw -g mode-keys vi

# Better copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# ~/.tmux.conf
bind-key b send-keys "source ~/.zshrc_ios_bridge" C-m
bind-key e send-keys "source ~/.zshrc_ios_engineering" C-m
bind-key m send-keys "source ~/.zshrc_ios_sickbay" C-m
bind-key h send-keys "source ~/.zshrc_ios_holodeck" C-m
bind-key o send-keys "source ~/.zshrc_ios_observation" C-m
bind-key s send-keys "source ~/.zshrc_ios_stellar" C-m

# Claude Code Agent Status Display
set -g allow-passthrough on
set -g status-right-length 150
# Use @variables for session-specific values
set -g status-right "🤖 #{@claude_agent} | #{@developer}  "

# Window tab-bar: Claude Code vs idle-shell indicators
# Detection: Claude Code renames the pane process to its semver string (e.g. 2.1.117),
# OR in some environments the process is named "claude". Both are matched.
# Claude windows get a light-amber background (colour215) and a "[claude]" marker on
# the tab's otherwise-blank first line (a non-colour cue, WCAG 1.4.1); other tabs take
# the status-left (badge) background, which is brighter than the bar (status-style).
# colour215 (255,175,95) is the amber that is farthest (RGB distance ~95) from every
# team badge colour while still passing 4.5:1 against black: the darker ambers
# (130/136/166/172) are within 40-80 of the badges or fail contrast.
# TEXT COLOUR (WCAG 1.4.3, 4.5:1) is chosen per background, never one fixed colour:
#   non-selected tab: black (colour16) on the badge/amber bg, but white (colour231)
#     where white contrasts better (badge colours 160 and 240);
#   selected tab (bold, black bg): the tab's own colour (amber, else the badge colour),
#     but white where that colour on black is under 4.5:1 (again 160 and 240).
# Both colour lists below are checked against every team badge colour found in
# */scripts/*-startup.sh by tests/test-xaca-1669-tmux-tabbar-contrast.sh, which fails
# and prints the expected lists when a new team colour needs a different choice.
# Width-adaptive tab labels (XACA-1678). The tab label was a fixed 22 columns (25 per
# tab with padding), so on a narrow client (iPad portrait, ~100-110 columns) four tabs
# overflowed behind tmux's ">" marker. The width is now chosen per client, at EVERY
# client width (so many windows on a wide client shrink too):
#   no client at all: 22;
#   otherwise: the largest of 22/18/14/10 that is <= B, floor 10, where
#     B = (client_width - 34) / session_windows - 3
#   (34 = 17 for status-left + gap plus 17 reserved for status-right; 3 = per-tab
#   padding; integer division). 10 still fits the 8-column "[claude]" marker.
#   Whenever the 22-wide bar fits (client_width >= 34 + 25 x windows, e.g. 134 for 4
#   windows, 184 for 6) the render is byte-identical to the XACA-1669 bar.
# The client_width guard is needed because it is empty with no client (and "0" is also
# false in #{?}), and such a value in the arithmetic would wrongly select the narrowest
# variant; both cases render 22.
# tmux 3.8 format modifiers cannot take a nested width (#{p-#{@w}:...} does not pad,
# #{=#{@w}:...} renders literally), hence one fixed variant per width, selected by #{?}.
# Known limit: many windows on a narrow client (6 @110) still floor at 10 and may overflow.
set -g @tab_label_width '#{?#{client_width},#{?#{e|>=:#{e|-:#{e|/:#{e|-:#{client_width},34},#{session_windows}},3},22},22,#{?#{e|>=:#{e|-:#{e|/:#{e|-:#{client_width},34},#{session_windows}},3},18},18,#{?#{e|>=:#{e|-:#{e|/:#{e|-:#{client_width},34},#{session_windows}},3},14},14,10}}},22}'
set -g @tab_label '#{?#{==:#{E:@tab_label_width},18},#{p-18:#{=18:#{window_index}:#{window_name}}},#{?#{==:#{E:@tab_label_width},14},#{p-14:#{=14:#{window_index}:#{window_name}}},#{?#{==:#{E:@tab_label_width},10},#{p-10:#{=10:#{window_index}:#{window_name}}},#{p-22:#{=22:#{window_index}:#{window_name}}}}}}'
set -g @tab_blank '#{?#{==:#{E:@tab_label_width},18},#{p-18:},#{?#{==:#{E:@tab_label_width},14},#{p-14:},#{?#{==:#{E:@tab_label_width},10},#{p-10:},#{p-22:}}}}'
set -g @tab_claude_marker '#{?#{==:#{E:@tab_label_width},18},#{p-18:#{l:[claude]}},#{?#{==:#{E:@tab_label_width},14},#{p-14:#{l:[claude]}},#{?#{==:#{E:@tab_label_width},10},#{p-10:#{l:[claude]}},#{p-22:#{l:[claude]}}}}}'
set -g window-status-format '#{?#{||:#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},#{==:#{pane_current_command},claude}},#[bg=colour215 fg=colour16],#[default]#[#{E:status-left-style}]#[fg=#{?#{m/r:^colour(160|240)$,#{s/.*bg=([#a-zA-Z0-9]+).*/\1/:status-left-style}},colour231,colour16} nobold]}#{E:@tab_label}#[default]'
set -g window-status-current-format '#{?#{||:#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},#{==:#{pane_current_command},claude}},#[bg=colour16 fg=colour215 bold],#[default bold bg=colour16 fg=#{?#{m/r:^colour(160|240)$,#{s/.*bg=([#a-zA-Z0-9]+).*/\1/:status-left-style}},colour231,#{s/.*bg=([#a-zA-Z0-9]+).*/\1/:status-left-style}}]}#{E:@tab_label}#[default]'
set -g window-status-style "default"
set -g window-status-current-style "bold"

# Two-line tab bar: bigger tap targets for touch clients (iPad).
# Both lines carry the full window list (tmux's default list, same range=window|N),
# so every tab is two lines tall and a tap on either line selects that window.
# Line 1 (status-format[0]): blank status-left and, per tab, a blank label (or the
# "[claude]" marker on Claude tabs) built with the same fixed-width padding
# (the @tab_blank variants, fixed-width padding that counts display columns) as line 2's label, so both lines stay the
# same width per tab even for CJK or emoji window names.
# Line 2 (status-format[1]): status-left + the tab labels. status-right is split across
# the lines, right-aligned: its agent field (starting at the robot emoji; may be empty
# in a fresh session, or the only field) on line 1 and everything else on line 2.
# Without an agent field (LCARS sessions) it splits at its last " | " instead; with no
# " | " it stays whole on line 2.
# status-left is trimmed and right-aligned in a fixed 15 columns plus 1 space, so the
# tabs start at the same column for every team (longest label today: 14 chars,
# "communications"). It is drawn in the bar's status-style, not status-left-style:
# the brighter badge colour is reserved for the tabs. Each tab, on both lines: a black
# space, 1 space in the tab's NON-selected background (amber for Claude, else the
# badge colour; so the selected tab keeps a stripe of it), then "#I:#W" right-aligned
# in a fixed 22 columns (longest name fleet-wide: "0:monitoring-dashboard"; longer
# names are cut to fit), then 1 space, both in its current background. Every tab is
# therefore the same width for every team. A black space ends the list.
set -g status 2
set -g 'status-format[0]' '#[align=left #{E:status-style}]#{p-16:}#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#[default bg=colour16] #[default]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#[default]#{?#{||:#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},#{==:#{pane_current_command},claude}},#[bg=colour215],#[#{E:status-left-style}]} #[default]#{?#{||:#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},#{==:#{pane_current_command},claude}},#[bg=colour215 fg=colour16],#[default]#[#{E:status-left-style}]#[fg=#{?#{m/r:^colour(160|240)$,#{s/.*bg=([#a-zA-Z0-9]+).*/\1/:status-left-style}},colour231,colour16} nobold]}#{?#{||:#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},#{==:#{pane_current_command},claude}},#{E:@tab_claude_marker},#{E:@tab_blank}}#[default]#{?#{||:#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},#{==:#{pane_current_command},claude}},#[bg=colour215],#[#{E:status-left-style}]} #[pop-default]#[norange default]#[default bg=colour16] #[default],#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#[default]#{?#{||:#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},#{==:#{pane_current_command},claude}},#[bg=colour215],#[#{E:status-left-style}]} #[default bold bg=colour16]#{?#{||:#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},#{==:#{pane_current_command},claude}},#[bg=colour16 fg=colour215 bold],#[default bold bg=colour16 fg=#{?#{m/r:^colour(160|240)$,#{s/.*bg=([#a-zA-Z0-9]+).*/\1/:status-left-style}},colour231,#{s/.*bg=([#a-zA-Z0-9]+).*/\1/:status-left-style}}]}#{?#{||:#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},#{==:#{pane_current_command},claude}},#{E:@tab_claude_marker},#{E:@tab_blank}}#[default]#[default bold bg=colour16] #[pop-default]#[norange list=on default]#[default bg=colour16] #[default]}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{?#{m:*🤖*,#{T;=/#{status-right-length}:status-right}},#{s/ *$/  /:#{s/^.*(🤖[^|]*).*$/\1/:#{T;=/#{status-right-length}:status-right}}},#{?#{m/r: \| ,#{T;=/#{status-right-length}:status-right}},#{s/^(.*) \| [^|]*$/\1  /:#{T;=/#{status-right-length}:status-right}},}}#[pop-default]#[norange default]'
set -g 'status-format[1]' '#[align=left range=left #{E:status-style}]#[push-default]#{p-15:#{s/^ *(.*[^ ]) *$/\1/:#{T:status-left}}} #[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#[default bg=colour16] #[default]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#[default]#{?#{||:#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},#{==:#{pane_current_command},claude}},#[bg=colour215],#[#{E:status-left-style}]} #[default]#{T:window-status-format}#{?#{||:#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},#{==:#{pane_current_command},claude}},#[bg=colour215],#[#{E:status-left-style}]} #[pop-default]#[norange default]#[default bg=colour16] #[default],#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#[default]#{?#{||:#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},#{==:#{pane_current_command},claude}},#[bg=colour215],#[#{E:status-left-style}]} #[default bold bg=colour16]#{T:window-status-current-format}#[default bold bg=colour16] #[pop-default]#[norange list=on default]#[default bg=colour16] #[default]}#[nolist align=right range=right #{E:status-ri