# Command Team Configuration
# Strategic planning and coordination
# Category: strategic

TEAM_ID="command"
TEAM_NAME="Starfleet Command"
TEAM_DESCRIPTION="Strategic planning and cross-team coordination"
TEAM_CATEGORY="strategic"
TEAM_COLOR="#FF0000"           # LCARS display color (red)
TEAM_LCARS_PORT_BASE="8230"    # XACA-0463: first port in template's band (instance ports allocated from base ..< base+range)
TEAM_LCARS_PORT_RANGE="10"     # XACA-0463: inclusive count of ports in band (freelance uses 100)
TEAM_LCARS_PORT="8230"         # DEPRECATED (XACA-0463) — derived from TEAM_LCARS_PORT_BASE; consumers should switch to BASE/RANGE
TEAM_TMUX_SOCKET="command"     # Dedicated tmux socket name

# Working directory (where this team's kanban boards and files live)
TEAM_WORKING_DIR="$HOME/dev-team"
TEAM_HAS_PROJECTS="false"

# Repository associations
TEAM_REPOS=(
    "dev-team"
)

# Homebrew dependencies (minimal - mostly planning tools)
TEAM_BREW_DEPS=(
    "jq"
)

# Homebrew cask dependencies
TEAM_BREW_CASK_DEPS=()

# Terminal roles (matches prompt files: command-{role}-prompt.txt)
TEAM_AGENTS=(
    "admiral"        # Admiral Charles Vance
    "communications" # Admiral Owen Paris
    "intelligence"   # Admiral Alynna Nechayev
    "operations"     # Admiral William Ross
    "strategic"      # Admiral Kathryn Janeway
)

# Per-agent tmux window names (space-separated: win0 win1 win2 win3)
AGENT_WINDOWS_admiral="admiral-cmd strategy coordination priorities"
AGENT_WINDOWS_communications="commodore-cmd projects roadmap stakeholders"

# Terminal slug map (XACA-0785)
# Maps the Claude agent identity (persona frontmatter `name:` — a character name)
# to the canonical terminal slug. The slug — never the character name — drives:
#   .zshrc_<team>_<slug>, <team>-<slug>-startup.sh, tmux SESSION_CODE,
#   and <team>-<slug>-prompt.txt resolution.
AGENT_TERMINAL_vance="admiral"
AGENT_TERMINAL_paris="communications"
AGENT_TERMINAL_nechayev="intelligence"
AGENT_TERMINAL_ross="operations"
AGENT_TERMINAL_janeway="strategic"

# Startup/shutdown script names
TEAM_STARTUP_SCRIPT="command-startup.sh"
TEAM_SHUTDOWN_SCRIPT="command-shutdown.sh"

# Organization this team belongs to
TEAM_ORGANIZATION="Starfleet Command"

# Star Trek theme
# XACA-0486-011: theme must be distinct from name. "Star Trek: Command Tier"
# is a Star Trek context label, distinct from "Starfleet Command" (name) and
# "Starfleet Headquarters" (ship).
TEAM_THEME="Star Trek: Command Tier"
TEAM_SHIP="Starfleet Headquarters"
