# DNS Framework Team Configuration
# Shared iOS/Android framework development (DNSFramework suite)
# Category: platform
#
# XACA-0853: this conf did not exist until 2026-09-09. Its absence made dns
# invisible to EVERY code path that discovers teams by globbing
# share/teams/*.conf — the team could not be provisioned, and sweeps believed
# to be fleet-wide silently skipped it. dns became load-bearing on 2026-09-02
# when the team migrated to M4Mini, a TAP CONSUMER with no dev-team checkout:
# the previous arrangement (hand-authored dns-*.sh committed to the dev-team
# repo root) only ever worked because dns ran on the dev-source machine.
#
# EVERY value below is transcribed from a live artifact, not chosen:
#   agents/windows  → dns-framework/scripts/dns-<agent>-startup.sh (TERMINAL_NAME)
#   terminal slugs  → .claude/agents-master/dns/*.md (persona frontmatter `name:`)
#   port band       → kanban-hooks/aiteamforge_paths.py DEFAULT_TEAMS["dns"]
#   socket          → dns-startup.sh (export TMUX_SOCKET="dns")
#   color           → lcars-ports/dns-lcars.theme
# XACA-0862 warned that fabricating this file without the real persona/window
# data would ship broken tmux session names. That data is the transcription
# above; do not hand-edit these lists without re-deriving them from the sources.

TEAM_ID="dns"
TEAM_NAME="Star Trek: Lower Decks - DNS Framework"
TEAM_DESCRIPTION="DNSFramework suite development across iOS, Android and Firebase"
TEAM_CATEGORY="platform"
TEAM_COLOR="#FF9900"           # LCARS display color (Operations Gold — lcars-ports/dns-lcars.theme)
TEAM_LCARS_PORT_BASE="8180"    # XACA-0463: first port in template's band
TEAM_LCARS_PORT_RANGE="10"     # XACA-0463: inclusive count of ports in band
TEAM_LCARS_PORT="8180"         # DEPRECATED (XACA-0463) — derived from TEAM_LCARS_PORT_BASE
TEAM_TMUX_SOCKET="dns"         # Dedicated tmux socket name (dns-startup.sh)

# Working directory. NOTE: unlike every other team this is an absolute SHARED
# path, not $HOME-relative — DNSFramework is an umbrella of 29 sub-repos under
# /Users/Shared so multiple accounts on a host can reach it.
TEAM_WORKING_DIR="/Users/Shared/Development/DNSFramework"
TEAM_HAS_PROJECTS="false"

# Repository associations. DNSFramework is an UMBRELLA: the two entries below
# are container directories, not repos. DNSFramework-iOS holds 28 independent
# sub-repos (each with its own .git); DNSFramework-Android is a single repo.
# kb-run routes to the right one via the kanban item's `subRepo` field.
TEAM_REPOS=(
    "DNSFramework-iOS"
    "DNSFramework-Android"
)

# Homebrew dependencies
TEAM_BREW_DEPS=(
    "jq"
)

# Homebrew cask dependencies
TEAM_BREW_CASK_DEPS=()

# Terminal roles (matches prompt files: dns-{role}-prompt.txt)
TEAM_AGENTS=(
    "command"    # Mariner    — Lead Feature Developer
    "bugbay"     # T'Ana      — Bug Fix Developer
    "testing"    # Shaxs      — Lead Tester
    "build"      # Rutherford — Release Engineer
    "refactor"   # Tendi      — Lead Refactoring Developer
    "apidesign"  # Boimler    — API Design / Developer Experience
    "docs"       # Ransom     — Documentation Lead
)

# Per-agent tmux window names (space-separated: win0 win1 win2 win3)
# Transcribed verbatim from TERMINAL_NAME= in each
# dns-framework/scripts/dns-<agent>-startup.sh. All seven share the same first
# three windows (command-center / ios-frameworks / android-frameworks) and
# differ only in the fourth, specialty window.
AGENT_WINDOWS_command="command-center ios-frameworks android-frameworks spm"
AGENT_WINDOWS_bugbay="command-center ios-frameworks android-frameworks crash-analysis"
AGENT_WINDOWS_testing="command-center ios-frameworks android-frameworks xctest-suite"
AGENT_WINDOWS_build="command-center ios-frameworks android-frameworks github-actions"
AGENT_WINDOWS_refactor="command-center ios-frameworks android-frameworks design-patterns"
AGENT_WINDOWS_apidesign="command-center ios-frameworks android-frameworks api-guidelines"
AGENT_WINDOWS_docs="command-center ios-frameworks android-frameworks docc-catalog"

# Terminal slug map (XACA-0785)
# Maps the Claude agent identity (persona frontmatter `name:` — a character
# name) to the canonical terminal slug. The slug — never the character name —
# drives: .zshrc_<team>_<slug>, <team>-<slug>-startup.sh, tmux SESSION_CODE,
# and <team>-<slug>-prompt.txt resolution.
AGENT_TERMINAL_mariner="command"
AGENT_TERMINAL_tana="bugbay"
AGENT_TERMINAL_shaxs="testing"
AGENT_TERMINAL_rutherford="build"
AGENT_TERMINAL_tendi="refactor"
AGENT_TERMINAL_boimler="apidesign"
AGENT_TERMINAL_ransom="docs"

# Startup/shutdown script names
TEAM_STARTUP_SCRIPT="dns-startup.sh"
TEAM_SHUTDOWN_SCRIPT="dns-shutdown.sh"

# Organization this team belongs to
TEAM_ORGANIZATION="DoubleNode"

# Star Trek theme
TEAM_THEME="Star Trek: Lower Decks"
TEAM_SHIP="USS Cerritos NCC-75567"
