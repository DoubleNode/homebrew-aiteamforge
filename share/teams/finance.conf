# Finance Team Configuration
# Personal finance management and automation
# Category: personal

TEAM_ID="finance"
TEAM_NAME="Ferengi Commerce Authority"
TEAM_DESCRIPTION="Personal finance management and automation"
TEAM_CATEGORY="personal"
TEAM_COLOR="#FFD700"           # LCARS display color (gold)
TEAM_LCARS_PORT_BASE="8360"    # XACA-0463: first port in template's band (instance ports allocated from base ..< base+range)
TEAM_LCARS_PORT_RANGE="10"     # XACA-0463: inclusive count of ports in band (freelance uses 100)
TEAM_LCARS_PORT="8360"         # DEPRECATED (XACA-0463) — derived from TEAM_LCARS_PORT_BASE; consumers should switch to BASE/RANGE
TEAM_TMUX_SOCKET="finance"     # Dedicated tmux socket name

# Working directory (where this team's projects live)
# Finance has sub-projects — each project gets its own kanban board
TEAM_WORKING_DIR="$HOME/finance"
TEAM_HAS_PROJECTS="true"
TEAM_DEFAULT_PROJECT="personal"

# Repository associations
TEAM_REPOS=()

# Homebrew dependencies (minimal)
TEAM_BREW_DEPS=()

# Homebrew cask dependencies
TEAM_BREW_CASK_DEPS=()

# Terminal roles (matches prompt files: finance-{role}-prompt.txt)
# XACA-0785: normalized from character names (zek, quark-fin, nog, brunt, rom)
# to the canonical location slugs — finance was the one team whose TEAM_AGENTS
# held Claude agent identities instead of terminal slugs, which broke
# _PROMPT_FILE resolution in install-team.sh (fleet-wide bug, finance was the
# only team it actually manifested on). Character identities are preserved
# below and in the AGENT_TERMINAL_* map.
TEAM_AGENTS=(
    "nagus"      # Grand Nagus's chambers — Zek, Lead Financial Strategist
    "bar"        # Quark's Bar — Quark, Budget & Expense Manager
    "vault"      # The Vault — Nog, Investment Analyst
    "fca"        # FCA Office — Brunt, Tax & Compliance Auditor
    "workshop"   # Workshop — Rom, Finance Automation Engineer
)

# Per-agent tmux window names (space-separated: win0 win1 win2 win3)
# Based on Ferengi Alliance roles
AGENT_WINDOWS_nagus="nagus-cmd strategy portfolio reports"
AGENT_WINDOWS_bar="bar-cmd expenses budget deals"
AGENT_WINDOWS_vault="vault-cmd research investments market"
AGENT_WINDOWS_fca="fca-cmd tax-prep deductions compliance"
AGENT_WINDOWS_workshop="workshop-cmd scripting tools data"

# Terminal slug map (XACA-0785)
# Maps the Claude agent identity (persona frontmatter `name:` — a character name)
# to the canonical terminal slug. The slug — never the character name — drives:
#   .zshrc_<team>_<slug>, <team>-<slug>-startup.sh, tmux SESSION_CODE,
#   and <team>-<slug>-prompt.txt resolution.
AGENT_TERMINAL_zek="nagus"
AGENT_TERMINAL_quark_fin="bar"
AGENT_TERMINAL_nog="vault"
AGENT_TERMINAL_brunt="fca"
AGENT_TERMINAL_rom="workshop"

# Startup/shutdown script names
TEAM_STARTUP_SCRIPT="finance-startup.sh"
TEAM_SHUTDOWN_SCRIPT="finance-shutdown.sh"

# Organization this team belongs to
TEAM_ORGANIZATION="Personal"

# Theme
TEAM_THEME="Star Trek: Deep Space Nine - Ferengi"
TEAM_SHIP="Ferengi Alliance Commerce Hub"
