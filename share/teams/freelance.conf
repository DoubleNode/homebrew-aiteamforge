# Freelance Team Configuration
# Full-stack project-based development
# Category: project

TEAM_ID="freelance"
TEAM_NAME="Star Trek: Enterprise - Full Stack Team"
TEAM_DESCRIPTION="Full-stack freelance project development (iOS, Android, Firebase)"
TEAM_CATEGORY="project"
TEAM_COLOR="#FF6699"           # LCARS display color (pink)
TEAM_LCARS_PORT_BASE="8500"    # XACA-0463: first port in template's band (instance ports allocated from base ..< base+range)
TEAM_LCARS_PORT_RANGE="100"    # XACA-0463: inclusive count of ports in band (freelance uses 100 to accommodate 6+ client instances)
TEAM_LCARS_PORT="8500"         # DEPRECATED (XACA-0463) — derived from TEAM_LCARS_PORT_BASE; consumers should switch to BASE/RANGE
TEAM_TMUX_SOCKET="freelance"   # Dedicated tmux socket name

# Working directory (where this team's kanban boards and files live)
TEAM_WORKING_DIR="$HOME/freelance"
TEAM_HAS_PROJECTS="true"
TEAM_REQUIRES_CLIENT_ID="true"
TEAM_DEFAULT_PROJECT="default"

# Repository associations (varies by project)
TEAM_REPOS=()

# Homebrew dependencies (full-stack tools)
TEAM_BREW_DEPS=(
    "swiftlint"
    "xcodegen"
    "gradle"
    "kotlin"
    "node"
    "firebase-cli"
)

# Homebrew cask dependencies
TEAM_BREW_CASK_DEPS=(
    "xcode"
    "android-studio"
)

# Terminal roles (matches prompt files: freelance-{role}-prompt.txt)
TEAM_AGENTS=(
    "command"     # Captain Jonathan Archer
    "comms"       # Ensign Hoshi Sato
    "engineering" # Commander Charles "Trip" Tucker III
    "helm"        # Ensign Travis Mayweather
    "science"     # Sub-Commander T'Pol
    "sickbay"     # Dr. Phlox
    "tactical"    # Lieutenant Malcolm Reed
)

# Per-agent tmux window names (space-separated: win0 win1 win2 win3)
# Based on NX-01 Enterprise station roles
AGENT_WINDOWS_command="command-center project-dev client-work architecture"
AGENT_WINDOWS_engineering="engineering-cmd build cicd deployment"
AGENT_WINDOWS_science="science-cmd refactoring analysis patterns"
AGENT_WINDOWS_sickbay="sickbay-cmd diagnostics hotfixes debugging"
AGENT_WINDOWS_tactical="tactical-cmd security testing penetration"
AGENT_WINDOWS_comms="comms-cmd documentation api-docs user-guides"
AGENT_WINDOWS_helm="helm-cmd ui-design ux-research prototyping"

# Terminal slug map (XACA-0785)
# Maps the Claude agent identity (persona frontmatter `name:` — a character name)
# to the canonical terminal slug. The slug — never the character name — drives:
#   .zshrc_<team>_<slug>, <team>-<slug>-startup.sh, tmux SESSION_CODE,
#   and <team>-<slug>-prompt.txt resolution.
AGENT_TERMINAL_archer="command"
AGENT_TERMINAL_sato="comms"
AGENT_TERMINAL_tucker="engineering"
AGENT_TERMINAL_mayweather="helm"
AGENT_TERMINAL_tpol="science"
AGENT_TERMINAL_phlox="sickbay"
AGENT_TERMINAL_reed="tactical"

# Startup/shutdown script names
TEAM_STARTUP_SCRIPT="freelance-startup.sh"
TEAM_SHUTDOWN_SCRIPT="freelance-shutdown.sh"

# Organization this team belongs to
TEAM_ORGANIZATION="Freelance"

# Star Trek theme
TEAM_THEME="Star Trek: Enterprise"
TEAM_SHIP="Enterprise NX-01"
