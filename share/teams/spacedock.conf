# Space Dock Team Configuration
# Per-machine emergency & recovery team (EPIC-0057) — NOT a development team.
# Category: infrastructure
#
# XACA-1069: this team owns no source repository and does no feature work.
# It exists to triage/repair/diagnose/root-cause the HOST it runs on (LCARS or
# service recovery, stalled launchd jobs, orphaned in-progress kanban items
# after an unclean shutdown, disk/log pressure, failed auto-upgrades,
# connectivity loss). XACA-1068 registers it in DEFAULT_TEAMS (not the
# per-machine overlay) so it survives registry self-heal; XACA-1070 forces it
# onto every consumer machine without it ever appearing in the install wizard.
#
# Board: ~/.aiteamforge/spacedock/kanban (per-machine, never git-tracked, no
# repo — see EPIC-0057 "Per-machine local board"). That path is set by
# XACA-1068's DEFAULT_TEAMS entry, not by anything in this file.

TEAM_ID="spacedock"
TEAM_NAME="Space Dock"
TEAM_DESCRIPTION="Per-machine emergency and recovery operations — LCARS/service recovery, stalled launchd jobs, orphaned kanban items, disk/log pressure, failed upgrades"
TEAM_CATEGORY="infrastructure"
TEAM_COLOR="#CC66FF"           # LCARS display color (violet). MUST stay light enough for TEXT use: lcars.css renders --div-spacedock as the avatar-tooltip name against a near-black ground, and the original #9933FF measured 4.03:1 against WCAG AA's 4.5:1 minimum (XACA-1069-013, UX gate). #CC66FF measures 6.52:1. Also the most separated choice in a crowded purple family — freelance #cc99ff, starwords #aa77dd, workstats #cc99cc, appplanning #bb88ee, dns #ccccff are taken. Keep in lockstep with registry.json's color and lcars.css/lcars.js.
TEAM_LCARS_PORT_BASE="8380"    # XACA-0463: first port in template's band (instance ports allocated from base ..< base+range) — XACA-1068 scan: [8370,8400) was the free gap
TEAM_LCARS_PORT_RANGE="10"     # XACA-0463: inclusive count of ports in band
TEAM_LCARS_PORT="8380"         # DEPRECATED (XACA-0463) — derived from TEAM_LCARS_PORT_BASE; consumers should switch to BASE/RANGE
TEAM_TMUX_SOCKET="spacedock"   # Dedicated tmux socket name

# Working directory. Space Dock has NO repository and NO $HOME/<team> project
# tree — unlike every code-owning team, there is nothing here to check out.
# TEAM_WORKING_DIR is set to the per-machine board's parent so any generator
# that shells into "$TEAM_WORKING_DIR" before doing per-team work lands
# somewhere real or (Q1) somewhere that exists before scan XACA-1068-006 runs
# kb-init-team. This mirrors how a repo-less team expresses "no working dir of
# its own" in this house format. TEAM_REPOS=() below follows the MAJORITY
# pattern, not a new one: 7 of the 10 existing confs already set it empty
# (android, finance, firebase, freelance, ios, legal, medical); only academy,
# command and dns name a repo.
TEAM_WORKING_DIR="$HOME/.aiteamforge/spacedock"
TEAM_HAS_PROJECTS="false"      # No sub-projects; also the flat-team marker (XACA-0853) that keeps this OUT of the TEAM_HAS_PROJECTS=true parametric-team loop in sync-tap.sh (line ~625) — Space Dock's per-agent stations are GENERATED from personas via install-team.sh, not shipped as hand-authored teams/spacedock-{startup,shutdown}.sh, same as academy/android/command/dns/firebase/ios.

# Repository associations — Space Dock owns NO source repository (EPIC-0057
# Requirement 1: "it owns no source repository and does no feature work").
# Deliberately empty, and well-precedented: 7 of 10 existing confs are also
# TEAM_REPOS=(). What IS new here is that Space Dock has no git repo anywhere
# at all — its board and working dir are per-machine under ~/.aiteamforge —
# whereas the other empty-array teams still live inside a repo.
TEAM_REPOS=()

# Homebrew dependencies — none beyond the baseline every AITeamForge install
# already requires (jq is used by the diagnostic tooling Space Dock fronts,
# e.g. aiteamforge-doctor.sh, and is already a universal dependency elsewhere
# in this directory, so it is listed here for parity, not because Space Dock
# introduces a new requirement).
TEAM_BREW_DEPS=(
    "jq"
)

# Homebrew cask dependencies
TEAM_BREW_CASK_DEPS=()

# Terminal roles (matches prompt files: spacedock-{role}-prompt.txt)
# XACA-1069: slugs, never character names — dockmaster/repair/diagnostics/
# analysis map to sisko-sd/scotty-sd/geordi-sd/spock-sd below. Filenames on
# disk (spacedock/scripts/prompts/spacedock-{dockmaster,repair,diagnostics,
# analysis}-prompt.txt) confirm these four exact slugs.
TEAM_AGENTS=(
    "dockmaster"    # Triage lead (Captain Benjamin Sisko / sisko-sd)
    "repair"        # Repair & salvage (Montgomery Scott / scotty-sd)
    "diagnostics"   # Diagnostic surface front-end (Geordi La Forge / geordi-sd)
    "analysis"      # Root-cause analysis (Spock / spock-sd)
)

# Per-agent tmux window names (space-separated).
# XACA-1069 "One window per tab": deliberately NOT Academy's four-windows-
# per-agent layout. A recovery session is short and single-threaded; four
# windows per tab would produce sixteen panes nobody uses, on every machine
# in the fleet, forever (see XACA-1069 plan doc "One window per tab"). Each
# entry below therefore carries exactly ONE window name, matching the tab's
# own role.
AGENT_WINDOWS_dockmaster="dockmaster"
AGENT_WINDOWS_repair="repair"
AGENT_WINDOWS_diagnostics="diagnostics"
AGENT_WINDOWS_analysis="analysis"

# Terminal slug map (XACA-0785)
# Maps the Claude agent identity (persona frontmatter `name:` — a character
# name) to the canonical terminal slug. The slug — never the character name —
# drives: .zshrc_<team>_<slug>, <team>-<slug>-startup.sh, tmux SESSION_CODE,
# and <team>-<slug>-prompt.txt resolution.
#
# HYPHEN-IN-NAME HANDLING: all four Space Dock personas carry a `-sd` suffix
# (sisko-sd, scotty-sd, geordi-sd, spock-sd) to avoid colliding with the
# bare-name directories that already exist under the flat, fleet-global
# ~/knowledge/agents/ namespace for sisko/scotty/geordi/spock (see XACA-1069
# plan doc "The -sd suffix is mandatory, not cosmetic"). A literal hyphen is
# NOT a legal character in a POSIX/bash variable name, so the key segment
# below substitutes '_' for '-' — this is NOT an improvisation: it is the
# EXISTING, LIVE, working convention in this exact house format, documented
# in install-team.sh ("XACA-0785-... The variable-name segment normalizes
# '-' to '_' (e.g. persona "quark-fin" -> AGENT_TERMINAL_quark_fin), matching
# the AGENT_WINDOWS_* convention") and already shipping today:
#   homebrew-tap/share/teams/finance.conf:  AGENT_TERMINAL_quark_fin="bar"
#   for persona finance/finance_quark-fin_budget_persona.md -> name: quark-fin
# install-team.sh resolves this at generation time via
# `char_key = character.lower().replace("-", "_")` against the persona's
# frontmatter `name:`, so AGENT_TERMINAL_sisko_sd below correctly binds to
# the persona whose frontmatter says `name: sisko-sd`. (VERIFIED: sourcing a
# line literally spelled `AGENT_TERMINAL_sisko-sd=...` is NOT valid shell —
# bash parses it as an attempted command invocation ("command not found"),
# never as an assignment — so a hyphenated key here would be a config bug,
# not a cosmetic choice. Use the underscore form ONLY.)
AGENT_TERMINAL_sisko_sd="dockmaster"
AGENT_TERMINAL_scotty_sd="repair"
AGENT_TERMINAL_geordi_sd="diagnostics"
AGENT_TERMINAL_spock_sd="analysis"

# Startup/shutdown script names
TEAM_STARTUP_SCRIPT="spacedock-startup.sh"
TEAM_SHUTDOWN_SCRIPT="spacedock-shutdown.sh"

# Organization this team belongs to
TEAM_ORGANIZATION="Starfleet Academy"

# Star Trek theme — the board 'subtitle' field in the LCARS UI (installer
# uppercases this into "STAR TREK: SPACE DOCK"). PINNED cross-session value —
# do not re-derive. Space Dock's crew is drawn from three different series
# (DS9's Sisko, TOS's Scotty and Spock, TNG's Geordi), so no single show
# theme applies; "Star Trek: Space Dock" names the IN-UNIVERSE FACILITY
# instead, following the command.conf precedent ("Star Trek: Command Tier")
# for a Trek team with no real show of its own. Measured across all 10
# existing confs: 8 TEAM_THEME values begin "Star Trek:"; the only 2 that
# don't (legal="Legal Drama", medical="Medical Drama") are the deliberately
# non-Trek teams, so "Star Trek:"-prefixed is also the majority convention.
TEAM_THEME="Star Trek: Space Dock"
TEAM_SHIP="Earth Spacedock"
