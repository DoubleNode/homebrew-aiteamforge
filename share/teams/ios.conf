# iOS Development Team Configuration
# Platform: iOS
# Category: platform

TEAM_ID="ios"
TEAM_NAME="Star Trek: TNG - iOS"
TEAM_DESCRIPTION="iOS app development with Swift/SwiftUI"
TEAM_CATEGORY="platform"
TEAM_COLOR="#FF9500"           # LCARS display color (orange)
TEAM_LCARS_PORT_BASE="8260"    # XACA-0463: first port in template's band (instance ports allocated from base ..< base+range)
TEAM_LCARS_PORT_RANGE="10"     # XACA-0463: inclusive count of ports in band (freelance uses 100)
TEAM_LCARS_PORT="8260"         # DEPRECATED (XACA-0463) — derived from TEAM_LCARS_PORT_BASE; consumers should switch to BASE/RANGE
TEAM_TMUX_SOCKET="ios"         # Dedicated tmux socket name

# Working directory (where this team's kanban boards and files live)
TEAM_WORKING_DIR="$HOME/ios"
TEAM_HAS_PROJECTS="false"

# Repository associations
TEAM_REPOS=()

# Homebrew dependencies (tools to install)
TEAM_BREW_DEPS=(
    "swiftlint"
    "xcodegen"
)

# Homebrew cask dependencies
# NOTE: Xcode must be installed via the Mac App Store — it is not available
# as a Homebrew cask. Install manually before running this team's setup.
TEAM_BREW_CASK_DEPS=()

# Terminal IDs (matches prompt files: ios-{terminal_id}-prompt.txt — most are
# bridge-station names, but `wesley` is a character-named exception)
TEAM_AGENTS=(
    "bridge"       # Captain Jean-Luc Picard
    "engineering"  # Lieutenant Commander Geordi La Forge
    "holodeck"     # Lieutenant Worf
    "observation"  # Counselor Deanna Troi
    "sickbay"      # Doctor Beverly Crusher
    "stellar"      # Lieutenant Commander Data
    "wesley"       # Wesley Crusher — UX/design (character-named exception:
                   # UX has no natural bridge-station equivalent, so the
                   # terminal carries the cadet's name; matches the persona's
                   # frontmatter `name: wesley`)
)

# Per-agent tmux window names (space-separated: win0 win1 win2 win3)
# Based on TNG station roles
AGENT_WINDOWS_bridge="bridge features architecture review"
AGENT_WINDOWS_sickbay="sickbay diagnostics crash-logs debugging"
AGENT_WINDOWS_stellar="stellar analysis optimization patterns"
AGENT_WINDOWS_observation="observation api-docs code-docs guides"
AGENT_WINDOWS_engineering="engineering build cicd deployment"
AGENT_WINDOWS_holodeck="holodeck simulations regression edge-cases"
AGENT_WINDOWS_wesley="wesley swiftui design-system prototyping"

# Terminal slug map (XACA-0785)
# Maps the Claude agent identity (persona frontmatter `name:` — a character name)
# to the canonical terminal slug. The slug — never the character name — drives:
#   .zshrc_<team>_<slug>, <team>-<slug>-startup.sh, tmux SESSION_CODE,
#   and <team>-<slug>-prompt.txt resolution.
AGENT_TERMINAL_captain="bridge"
AGENT_TERMINAL_geordi="engineering"
AGENT_TERMINAL_worf="holodeck"
AGENT_TERMINAL_counselor="observation"
AGENT_TERMINAL_beverly="sickbay"
AGENT_TERMINAL_data="stellar"
AGENT_TERMINAL_wesley="wesley"

# Startup/shutdown script names
TEAM_STARTUP_SCRIPT="ios-startup.sh"
TEAM_SHUTDOWN_SCRIPT="ios-shutdown.sh"

# Organization this team belongs to
TEAM_ORGANIZATION="Main Event Entertainment"

# Star Trek theme
TEAM_THEME="Star Trek: The Next Generation"
TEAM_SHIP="USS Enterprise-D"
