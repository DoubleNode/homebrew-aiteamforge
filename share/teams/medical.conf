# Medical Team Configuration
# Medical documentation and research support
# Category: strategic

TEAM_ID="medical"
TEAM_NAME="House MD"
TEAM_DESCRIPTION="Medical documentation and research support"
TEAM_CATEGORY="strategic"
TEAM_COLOR="#00FFFF"           # LCARS display color (cyan)
TEAM_LCARS_PORT_BASE="8340"    # XACA-0463: first port in template's band (instance ports allocated from base ..< base+range)
TEAM_LCARS_PORT_RANGE="10"     # XACA-0463: inclusive count of ports in band (freelance uses 100)
TEAM_LCARS_PORT="8340"         # DEPRECATED (XACA-0463) — derived from TEAM_LCARS_PORT_BASE; consumers should switch to BASE/RANGE
TEAM_TMUX_SOCKET="medical"     # Dedicated tmux socket name

# Working directory (where this team's projects live)
# Medical has sub-projects — each project gets its own kanban board
TEAM_WORKING_DIR="$HOME/medical"
TEAM_HAS_PROJECTS="true"
TEAM_DEFAULT_PROJECT="general"

# Repository associations
TEAM_REPOS=()

# Homebrew dependencies (minimal)
TEAM_BREW_DEPS=()

# Homebrew cask dependencies
TEAM_BREW_CASK_DEPS=()

# Terminal roles (matches prompt files: medical-{role}-prompt.txt)
TEAM_AGENTS=(
    "diagnostics" # Dr. Gregory House
    "emergency"   # Dr. Lisa Cuddy
    "immunology"  # Dr. Allison Cameron
    "neurology"   # Dr. Eric Foreman
    "oncology"    # Dr. James Wilson
    "surgery"     # Dr. Robert Chase
)

# Per-agent tmux window names (space-separated: win0 win1 win2 win3)
# Based on Princeton-Plainsboro Teaching Hospital departments
AGENT_WINDOWS_diagnostics="diagnostics-cmd differential case-review whiteboard"
AGENT_WINDOWS_surgery="surgery-cmd triage hotfix post-op"
AGENT_WINDOWS_immunology="immunology-cmd test-suite integration coverage"
AGENT_WINDOWS_neurology="neurology-cmd code-scan refactor optimization"
AGENT_WINDOWS_oncology="oncology-cmd documentation api-docs team-comms"
AGENT_WINDOWS_emergency="emergency-cmd release-prep deployment monitoring"

# Terminal slug map (XACA-0785)
# Maps the Claude agent identity (persona frontmatter `name:` — a character name)
# to the canonical terminal slug. The slug — never the character name — drives:
#   .zshrc_<team>_<slug>, <team>-<slug>-startup.sh, tmux SESSION_CODE,
#   and <team>-<slug>-prompt.txt resolution.
AGENT_TERMINAL_house="diagnostics"
AGENT_TERMINAL_cuddy="emergency"
AGENT_TERMINAL_cameron="immunology"
AGENT_TERMINAL_foreman="neurology"
AGENT_TERMINAL_wilson="oncology"
AGENT_TERMINAL_chase="surgery"

# Startup/shutdown script names
TEAM_STARTUP_SCRIPT="medical-startup.sh"
TEAM_SHUTDOWN_SCRIPT="medical-shutdown.sh"

# Organization this team belongs to
TEAM_ORGANIZATION="DoubleNode"

# Theme
# XACA-0486-011: theme must be distinct from name to avoid duplicate sidebar
# fields on the LCARS board. "Medical Drama" is the genre label, distinct
# from "House MD" (name) and "Princeton-Plainsboro Teaching Hospital" (ship).
TEAM_THEME="Medical Drama"
TEAM_SHIP="Princeton-Plainsboro Teaching Hospital"
