# Academy Team Configuration
# Infrastructure team managing dev-team environment itself
# Category: infrastructure

TEAM_ID="academy"
TEAM_NAME="Starfleet Academy"
TEAM_DESCRIPTION="AI team development infrastructure and tooling"
TEAM_CATEGORY="infrastructure"
TEAM_COLOR="#0099CC"           # LCARS display color (blue)
TEAM_LCARS_PORT_BASE="8200"    # XACA-0463: first port in template's band (instance ports allocated from base ..< base+range)
TEAM_LCARS_PORT_RANGE="10"     # XACA-0463: inclusive count of ports in band (freelance uses 100)
TEAM_LCARS_PORT="8200"         # DEPRECATED (XACA-0463) — derived from TEAM_LCARS_PORT_BASE; consumers should switch to BASE/RANGE
TEAM_TMUX_SOCKET="academy"     # Dedicated tmux socket name

# Working directory (where this team's kanban boards and files live)
TEAM_WORKING_DIR="$HOME/academy"
TEAM_HAS_PROJECTS="false"       # true if team has sub-projects (e.g., legal, medical)

# Repository associations (Academy owns dev-team infrastructure)
TEAM_REPOS=(
    "dev-team"
)

# Homebrew dependencies (tools to install)
TEAM_BREW_DEPS=(
    "python@3"
    "node"
    "jq"
    "gh"
)

# Homebrew cask dependencies
TEAM_BREW_CASK_DEPS=()

# Terminal roles (matches prompt files: academy-{role}-prompt.txt)
TEAM_AGENTS=(
    "chancellor"   # Academy Chancellor (Nahla Ake)
    "engineering"  # Chief Technical Instructor (Jett Reno)
    "medical"      # Documentation Specialist (The Doctor EMH)
    "training"     # Testing Coordinator (Lura Thok)
)

# Per-agent tmux window names (space-separated: win0 win1 win2 win3)
# Matches the existing dev-team terminal definitions
AGENT_WINDOWS_chancellor="chancellor-cmd architecture strategy coordination"
AGENT_WINDOWS_engineering="engineering-cmd scripts infrastructure debugging"
AGENT_WINDOWS_medical="medical-cmd documentation training knowledge"
AGENT_WINDOWS_training="training-cmd testing standards quality"

# Terminal slug map (XACA-0785)
# Maps the Claude agent identity (persona frontmatter `name:` — a character name)
# to the canonical terminal slug. The slug — never the character name — drives:
#   .zshrc_<team>_<slug>, <team>-<slug>-startup.sh, tmux SESSION_CODE,
#   and <team>-<slug>-prompt.txt resolution.
AGENT_TERMINAL_nahla="chancellor"
AGENT_TERMINAL_reno="engineering"
AGENT_TERMINAL_emh="medical"
AGENT_TERMINAL_thok="training"
# TODO(XACA-0785): lal (UX evaluator persona) has no dedicated terminal slot —
# TEAM_AGENTS has no "ux" entry and there is no academy-ux-prompt.txt on disk.
# lal is invoked directly as a subagent (see CLAUDE.md "UX expert by team"),
# never launched via install-team.sh as a persistent terminal. Pre-existing
# gap, not invented here — flagged for follow-up if a dedicated UX terminal
# is ever wanted.
AGENT_TERMINAL_lal="ux"

# Startup/shutdown script names
TEAM_STARTUP_SCRIPT="academy-startup.sh"
TEAM_SHUTDOWN_SCRIPT="academy-shutdown.sh"

# Organization this team belongs to
TEAM_ORGANIZATION="Starfleet Academy"

# Star Trek theme — used as the board 'subtitle' field (the upper-left
# caption in the LCARS UI). Should be the show/franchise name, NOT the
# team name. The team name is already set via TEAM_NAME above. The
# installer uppercases this when writing to the board JSON.
TEAM_THEME="Star Trek: Discovery"
TEAM_SHIP="Starfleet Academy Campus"
