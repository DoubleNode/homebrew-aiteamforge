# AFC Richmond Team Configuration
# Ted Lasso themed personal-assistant team (EPIC-0075; charter: docs/richmond-charter.md) — NOT a Star Trek team.
# Category: project
#
# XACA-1713: Tap 0.21.11 shipped Richmond's personas and images but no conf,
# so install-team.sh (which sources share/teams/<team>.conf) could not
# provision it on a consumer machine. This is a FLAT team (TEAM_HAS_PROJECTS=
# "false"): its startup/shutdown scripts and the 7 station scripts are
# GENERATED by install-team.sh from the fields below, NOT shipped as
# hand-authored teams/richmond-*.sh (the dev-team richmond/scripts/*-startup.sh
# and home-scripts/.zshrc_richmond_* files are dev-machine copies — shipping
# them repeats the dns defect recorded in sync-tap.sh's XACA-0853 block).
#
# Values mirror the dev-team canonical sources: DEFAULT_TEAMS["richmond"] in
# kanban-hooks/aiteamforge_paths.py (team_code AFC, port band 8620/10),
# scripts/kb-init-team (AFC series: theme "TED LASSO", ship "AFC Richmond -
# Nelson Road", terminal:persona roster) and richmond/scripts/*-startup.sh
# (tmux window names).

TEAM_ID="richmond"
TEAM_NAME="AFC Richmond"
TEAM_DESCRIPTION="Personal-assistant team — daily huddle, research and planning, calendar and logistics, communications and drafting, tasks and accountability, habits and wellbeing, journal and recaps (Ted Lasso themed)"
TEAM_CATEGORY="project"
TEAM_COLOR="#5FAFFF"           # LCARS display color (Richmond Sky Blue — xterm-256 colour 75, the SKYBLUE_MAIN of richmond/scripts/richmond-banner.sh). Provisional: no LCARS stylesheet carries a --div-richmond token yet; keep in lockstep with registry.json's color if one is added.
TEAM_LCARS_PORT_BASE="8620"    # XACA-0463: first port in template's band (instance ports allocated from base ..< base+range) — matches DEFAULT_TEAMS["richmond"] (XACA-1676); clear of 8600, which EPIC-0063 reserves
TEAM_LCARS_PORT_RANGE="10"     # XACA-0463: inclusive count of ports in band
TEAM_LCARS_PORT="8620"         # DEPRECATED (XACA-0463) — derived from TEAM_LCARS_PORT_BASE; consumers should switch to BASE/RANGE
TEAM_TMUX_SOCKET="richmond"    # Dedicated tmux socket name

# Working directory (single-instance team: one working dir, one kanban board,
# one LCARS port — no PROJECTID). Matches the dev-team startup scripts'
# SESSION_DIRECTORY="$HOME/richmond" and DEFAULT_TEAMS["richmond"].working_dir.
TEAM_WORKING_DIR="$HOME/richmond"
TEAM_HAS_PROJECTS="false"      # Flat-team marker (XACA-0853): keeps this OUT of the TEAM_HAS_PROJECTS=true parametric-team loop in sync-tap.sh — Richmond's per-agent stations are GENERATED from personas via install-team.sh, not shipped as hand-authored teams/richmond-{startup,shutdown}.sh.

# Repository associations — none. ~/richmond is itself the team's git repo
# (.claude/personas-manifest.json: targetRepo ~/richmond, isGitRepo true), the
# same shape as the other empty-array teams (android, finance, firebase,
# freelance, ios, legal, medical).
#
# TEAM_PERSONA_DEPLOY_MODE is deliberately OMITTED (contrast spacedock.conf's
# "flat-dir"): ~/richmond is a git work tree, and the flat-dir deployer
# refuses (rc 4) any target inside one. Personas reach ~/richmond/.claude/agents
# through the normal git-tracked path.
TEAM_REPOS=()

# Homebrew dependencies — baseline only (jq, as every other flat team lists).
TEAM_BREW_DEPS=(
    "jq"
)

# Homebrew cask dependencies
TEAM_BREW_CASK_DEPS=()

# Terminal roles (matches prompt files: richmond-{role}-prompt.txt)
# Slugs, never character names — verified against the 7 files in
# richmond/scripts/prompts/ and richmond/scripts/launch-richmond-*.sh.
TEAM_AGENTS=(
    "office"        # The Gaffer's Office — Team Lead & Daily Huddle (Ted Lasso / ted)
    "tactics"       # The Tactics Room — Research & Planning (Coach Beard / beard)
    "operations"    # Club Operations — Calendar, Logistics & Admin (Leslie Higgins / higgins)
    "pressroom"     # The Press Room — Communications & Drafting (Keeley Jones / keeley)
    "training"      # The Training Ground — Tasks & Accountability (Roy Kent / roy)
    "clinic"        # The Clinic — Habits & Wellbeing (Dr. Sharon Fieldstone / sharon)
    "pressbox"      # The Press Box — Journal, Notes & Recaps (Trent Crimm / trent)
)

# Per-agent tmux window names (space-separated).
# Taken verbatim from the TERMINAL_NAME case blocks of
# richmond/scripts/richmond-<slug>-startup.sh: four windows per station, the
# first being the <slug>-cmd command center (Academy's layout).
AGENT_WINDOWS_office="office-cmd huddle priorities week-ahead"
AGENT_WINDOWS_tactics="tactics-cmd research analysis plans"
AGENT_WINDOWS_operations="operations-cmd calendar logistics admin"
AGENT_WINDOWS_pressroom="pressroom-cmd inbox drafts messages"
AGENT_WINDOWS_training="training-cmd tasks follow-ups check-ins"
AGENT_WINDOWS_clinic="clinic-cmd habits wellbeing boundaries"
AGENT_WINDOWS_pressbox="pressbox-cmd journal notes recaps"

# Terminal slug map (XACA-0785)
# Maps the Claude agent identity (persona frontmatter `name:` — a character
# name) to the canonical terminal slug. The slug — never the character name —
# drives: .zshrc_<team>_<slug>, <team>-<slug>-startup.sh, tmux SESSION_CODE,
# and <team>-<slug>-prompt.txt resolution. Persona names are the frontmatter
# `name:` of .claude/agents-master/richmond/*.md; none contains a hyphen, so no
# '-' -> '_' normalisation is needed. Roster matches kb-init-team's AFC list.
AGENT_TERMINAL_ted="office"
AGENT_TERMINAL_beard="tactics"
AGENT_TERMINAL_higgins="operations"
AGENT_TERMINAL_keeley="pressroom"
AGENT_TERMINAL_roy="training"
AGENT_TERMINAL_sharon="clinic"
AGENT_TERMINAL_trent="pressbox"

# Startup/shutdown script names
TEAM_STARTUP_SCRIPT="richmond-startup.sh"
TEAM_SHUTDOWN_SCRIPT="richmond-shutdown.sh"

# Organization this team belongs to (ticket XACA-1713; same string kb-init-team
# uses as the AFC "ship")
TEAM_ORGANIZATION="AFC Richmond - Nelson Road"

# Series theme — the board 'subtitle' field in the LCARS UI (installer
# uppercases it into "TED LASSO"). Matches kb-init-team's _series_to_theme AFC
# value. Richmond is the first non-Star-Trek, non-"Drama" team, so the show
# title stands alone (cf. legal="Legal Drama", medical="Medical Drama").
TEAM_THEME="Ted Lasso"
TEAM_SHIP="AFC Richmond - Nelson Road"
