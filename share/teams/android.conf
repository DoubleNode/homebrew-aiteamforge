# Android Development Team Configuration
# Platform: Android
# Category: platform

TEAM_ID="android"
TEAM_NAME="Star Trek: TOS - Android"
TEAM_DESCRIPTION="Android app development with Kotlin"
TEAM_CATEGORY="platform"
TEAM_COLOR="#3DDC84"           # LCARS display color (green)
TEAM_LCARS_PORT_BASE="8280"    # XACA-0463: first port in template's band (instance ports allocated from base ..< base+range)
TEAM_LCARS_PORT_RANGE="10"     # XACA-0463: inclusive count of ports in band (freelance uses 100)
TEAM_LCARS_PORT="8280"         # DEPRECATED (XACA-0463) — derived from TEAM_LCARS_PORT_BASE; consumers should switch to BASE/RANGE
TEAM_TMUX_SOCKET="android"     # Dedicated tmux socket name

# Working directory (where this team's kanban boards and files live)
TEAM_WORKING_DIR="$HOME/android"
TEAM_HAS_PROJECTS="false"

# Repository associations
TEAM_REPOS=()

# Homebrew dependencies (tools to install)
TEAM_BREW_DEPS=(
    "gradle"
    "kotlin"
)

# Homebrew cask dependencies
TEAM_BREW_CASK_DEPS=(
    "android-studio"
)

# Terminal roles (matches prompt files: android-{role}-prompt.txt)
TEAM_AGENTS=(
    "bridge"         # Captain James T. Kirk
    "communications" # Lieutenant Nyota Uhura
    "engineering"    # Lieutenant Commander Montgomery "Scotty" Scott
    "helm"           # Lieutenant Hikaru Sulu
    "navigation"     # Ensign Pavel Chekov
    "science"        # Commander Spock
    "sickbay"        # Dr. Leonard "Bones" McCoy
)

# Per-agent tmux window names (space-separated: win0 win1 win2 win3)
# Based on TOS station roles
AGENT_WINDOWS_bridge="bridge features compose-ui architecture"
AGENT_WINDOWS_sickbay="sickbay diagnostics logcat crash-analysis"
AGENT_WINDOWS_engineering="engineering build gradle play-store"
AGENT_WINDOWS_communications="comms ui-design material-design accessibility"
AGENT_WINDOWS_helm="helm api-docs guides architecture"
AGENT_WINDOWS_navigation="navigation unit-tests espresso integration-tests"
AGENT_WINDOWS_science="science refactoring performance analysis"

# Terminal slug map (XACA-0785)
# Maps the Claude agent identity (persona frontmatter `name:` — a character name)
# to the canonical terminal slug. The slug — never the character name — drives:
#   .zshrc_<team>_<slug>, <team>-<slug>-startup.sh, tmux SESSION_CODE,
#   and <team>-<slug>-prompt.txt resolution.
AGENT_TERMINAL_kirk="bridge"
AGENT_TERMINAL_uhura="communications"
AGENT_TERMINAL_scotty="engineering"
AGENT_TERMINAL_sulu="helm"
AGENT_TERMINAL_chekov="navigation"
AGENT_TERMINAL_spock="science"
AGENT_TERMINAL_mccoy="sickbay"

# Startup/shutdown script names
TEAM_STARTUP_SCRIPT="android-startup.sh"
TEAM_SHUTDOWN_SCRIPT="android-shutdown.sh"

# Organization this team belongs to
TEAM_ORGANIZATION="Main Event Entertainment"

# Star Trek theme
TEAM_THEME="Star Trek: The Original Series"
TEAM_SHIP="Starship Enterprise NCC-1701"
