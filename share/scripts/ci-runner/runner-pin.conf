# runner-pin.conf - the actions/runner release this AITeamForge release knows about (XACA-1443-014).
#
# DATA, never sourced: `key=value` lines, read with awk by lib/ci-runner-version.sh. Shipped in the keg next to
# provision-host.sh. Three jobs:
#   1. the PINNED FALLBACK: when GitHub cannot be asked for the latest runner and nothing newer is already staged,
#      provision-host.sh stages pin_version and verifies it against the sha256 recorded HERE (it never trusts an
#      unverified download). It says so out loud and records source=pinned, so `ci status` warns until a real
#      refresh succeeds.
#   2. the RECORDED MINIMUM for skew: a host whose staged runner is OLDER than pin_version is skewed
#      (`aiteamforge ci refresh` re-stages the newest verified release). Bumping this file in a release is what
#      makes every enabled host pick up a new runner after `brew upgrade`.
#   3. the registration floor and the staleness window used by `ci status`.
#
# Refresh the pin on every AITeamForge release that follows a new actions/runner release. Both sha256 values come
# from the release notes (the `BEGIN SHA <asset> -->` markers) of https://github.com/actions/runner/releases/tag/v<pin_version>.
# A pin whose sha256 is not 64 hex digits is unusable (fail closed: no fallback is then available).

# GitHub: "To configure or register a runner, the runner must be on version 2.329.0 or later" (changelog 2026-06-12).
registration_min=2.329.0

pin_version=2.338.0
pin_published=2026-10-06
pin_sha256_linux_arm64=628b4a7258487b80c1d3c221095a7ded349f5ae0175fd3dfab708d07428f041b
pin_sha256_osx_arm64=df4cebda25c86a886ed204e49fee63f5c2e7cec5f447b5c98440a826bbdf9df2

# GitHub stops queuing jobs to a runner more than 30 days behind the newest release. A runner staged from "latest" at
# time T is the newest release at T, so it is acceptable until at least T+30d; warn at 21 days to leave 9 days of margin.
max_age_days=21
