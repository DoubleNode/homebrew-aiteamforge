name: Test Homebrew Formula

on:
  # XACA-0845-010: libexec/** and bin/** MUST be in these filters. Without
  # them a PR touching only installer/upgrade/CLI code never triggered this
  # workflow at all — the suites below (and the syntax check) simply did not
  # run, and the PR showed no failing checks. That is how a bash 3.2 parse
  # error in libexec/commands/aiteamforge-upgrade.sh reached review green.
  push:
    branches: [ main, develop ]
    paths:
      - 'Formula/**'
      - '.github/workflows/tests.yml'
      - 'tests/**'
      - 'scripts/**'
      - 'fleet-monitor/**'
      - 'libexec/**'
      - 'bin/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Formula/**'
      - '.github/workflows/tests.yml'
      - 'tests/**'
      - 'scripts/**'
      - 'fleet-monitor/**'
      - 'libexec/**'
      - 'bin/**'
  workflow_dispatch:

jobs:
  test-formula:
    name: Test Formula on macOS
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-14 is the primary target (Apple Silicon, current macOS).
        # macos-13 (Ventura, Intel) was dropped in XACA-0499 — GHA Intel
        # macOS runners are heavily oversubscribed and routinely queue
        # for hours without ever scheduling, blocking PR merges on an
        # infrastructure bottleneck rather than a real test failure.
        os: [macos-14]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Caches/pip
          key: ${{ runner.os }}-homebrew-${{ hashFiles('Formula/aiteamforge.rb') }}
          restore-keys: |
            ${{ runner.os }}-homebrew-

      - name: Install formula dependencies
        run: |
          brew install python@3.13 node jq gh git

      - name: Tap local repository
        run: |
          mkdir -p $(brew --repository)/Library/Taps/doublenode
          ln -s $PWD $(brew --repository)/Library/Taps/doublenode/homebrew-aiteamforge

      - name: Audit formula
        if: github.ref == 'refs/heads/main'
        run: |
          brew audit --strict --online Formula/aiteamforge.rb

      - name: Install formula
        run: |
          brew install --verbose --build-from-source aiteamforge

      - name: Test formula
        run: |
          brew test aiteamforge

      - name: Verify installation
        run: |
          # Check main commands exist
          which aiteamforge
          which aiteamforge-setup
          which aiteamforge-doctor

          # Check they're executable
          aiteamforge --version
          aiteamforge-setup --help
          aiteamforge-doctor --version

          # Verify core files installed (paths reflect post-XACA-0499 layout:
          # libexec.install Dir["*"] mirrors the tap repo under prefix/libexec/)
          test -d $(brew --prefix)/opt/aiteamforge/libexec/scripts
          test -d $(brew --prefix)/opt/aiteamforge/libexec/share/templates
          test -d $(brew --prefix)/opt/aiteamforge/libexec/docs
          test -d $(brew --prefix)/opt/aiteamforge/libexec/libexec/lib
          test -d $(brew --prefix)/opt/aiteamforge/libexec/libexec/commands

      - name: Test setup wizard (dry run)
        run: |
          # Test help output
          aiteamforge setup --help

      - name: Test doctor (without config)
        run: |
          # Should report not configured but not crash
          aiteamforge doctor --check dependencies || true
          aiteamforge doctor --check framework

      - name: Uninstall formula
        run: |
          brew uninstall aiteamforge

      - name: Verify clean uninstall
        run: |
          # Commands should not exist
          ! which aiteamforge || exit 1
          ! which aiteamforge-setup || exit 1
          ! which aiteamforge-doctor || exit 1

  lint-formula:
    name: Lint Formula
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Lint formula with brew style
        # `brew style` already runs the same RuboCop config that Homebrew
        # vendors, so a separate `rubocop` step is redundant. It also
        # cannot install — rubocop is a gem, not a brew formula — and the
        # prior step here was a no-op-then-fail. Removed (XACA-0499).
        run: |
          brew style Formula/aiteamforge.rb

  drift-guard:
    name: Setup-Wizard Drift Guard (XACA-0173)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run setup-wizard drift guard
        run: |
          bash scripts/check-no-setup-drift.sh

  tap-hygiene-guard:
    name: Tap-Hygiene Guard (XACA-0361)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tap-hygiene guard
        run: |
          bash scripts/check-tap-hygiene.sh

  manifest-completeness-guard:
    name: Manifest Completeness Guard (XACA-0707)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run manifest completeness gate
        run: |
          chmod +x tests/ci-manifest-check.sh
          bash tests/ci-manifest-check.sh

  test-scripts:
    name: Test Core Scripts
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install python@3.13 node jq

      - name: Check script syntax
        run: |
          # XACA-0845-009: parse EVERY shipped bash script under /bin/bash,
          # which on macOS is bash 3.2 — the interpreter on every consumer box.
          #
          # This step used to name three bin/ scripts and used PATH `bash`
          # (Homebrew bash 5.x on the runner). Both gaps mattered: the file
          # that actually broke was libexec/commands/aiteamforge-upgrade.sh,
          # which was never checked at all, and its defect was a bash 3.2-only
          # parse failure (3.2 does not treat a here-doc nested in $( ) as
          # opaque, so one apostrophe in a comment unterminated the whole
          # file). bash 5.x parses that same file cleanly. So the regression
          # shipped through a green "Check script syntax" twice over.
          #
          # Scope: files with a bash shebang under libexec/ and bin/. zsh
          # scripts and templates are deliberately excluded — `bash -n` on a
          # zsh script is not a meaningful check, and *.template files are not
          # valid shell until rendered.
          set -euo pipefail
          echo "Using $(/bin/bash --version | head -1)"
          rc=0
          checked=0
          while IFS= read -r f; do
            head -1 "$f" | grep -qE '^#!.*(bin/bash|env bash)' || continue
            checked=$((checked + 1))
            if ! /bin/bash -n "$f"; then
              echo "::error file=$f::bash 3.2 syntax check failed"
              rc=1
            fi
          done < <(find libexec bin -type f -name '*.sh' | sort)
          echo "Checked $checked bash script(s) under /bin/bash."
          # A pathing/glob mistake that checks NOTHING must fail, not pass
          # green — this whole step exists because a vacuous check shipped a
          # parse error.
          if [ "$checked" -lt 10 ]; then
            echo "::error::expected to check at least 10 bash scripts, checked $checked — the file discovery is broken"
            rc=1
          fi
          exit $rc

      - name: Run ShellCheck on scripts
        run: |
          brew install shellcheck
          shellcheck bin/*.sh || true  # Allow warnings for now

      - name: Test script permissions
        run: |
          # Scripts should be executable
          test -x bin/aiteamforge-cli.sh
          test -x bin/aiteamforge-setup.sh
          test -x bin/aiteamforge-doctor.sh

  # ─────────────────────────────────────────────────────────────────────────────
  # Shell Test Suites — tests/
  # ─────────────────────────────────────────────────────────────────────────────
  test-shell-homebrew-tap:
    name: Shell Tests (homebrew-tap)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        # bash 4+ is required for `declare -A` in test-multi-team.sh.
        # macOS-latest ships /bin/bash 3.2 only — brew bash is invoked
        # explicitly in the multi-team step below (XACA-0504).
        run: |
          brew install jq bash

      - name: Make test scripts executable
        run: |
          chmod +x tests/test-runner.sh
          chmod +x tests/test-*.sh

      - name: Run test-runner exit-propagation regression (XACA-0653)
        # Runs FIRST: validates test-runner.sh propagates a suite's non-zero
        # exit even when the suite keeps its own pass/fail counters (no FAIL:
        # lines). If the runner itself is broken, every downstream suite result
        # is untrustworthy — so gate the runner's integrity before trusting it.
        # Self-contained (trivial stubs); needs no clean install.
        run: |
          bash tests/test-xaca-0653-runner-exit-propagation.sh

      - name: Run all plain-shell tests (manifest-driven, XACA-0707)
        # Source of truth: tests/ci-manifest (category == plain-shell).
        # The manifest-completeness-guard job ensures every tests/test-*.sh is
        # listed here, so this loop auto-enrolls new plain-shell tests without
        # any manual YAML edits. brew-bash tests run in the separate step below.
        # test-xaca-0653-runner-exit-propagation.sh is plain-shell but runs
        # FIRST (above) outside this loop so its runner-integrity gate fires
        # before the bulk suite; it is still correctly enrolled in ci-manifest.
        # NON_INTERACTIVE set globally — a no-op for tests that don't inspect it
        # (e.g. test-e2e-setup-launch.sh uses it to suppress wizard blocking).
        env:
          NON_INTERACTIVE: "true"
        run: |
          set -euo pipefail
          FAILED=0
          # XACA-0862: COUNT what we actually consumed, and assert it against the
          # manifest. A test that reads stdin inherits this loop's stdin — the
          # `< <(awk ...)` process substitution — drains the remaining entries,
          # and the loop simply ENDS EARLY while reporting success for everything
          # it did run. Observed in the field: 23 of 73 entries executed, with
          # entries 58-73 (including every XACA-0845/0862/0925 suite) silently
          # never run across three consecutive pushes. The XACA-0707 completeness
          # guard could not catch it because it verifies ENROLLMENT, not
          # EXECUTION. `< /dev/null` on the runner stops the drain; the
          # EXECUTED == EXPECTED assertion below is what makes a future drain
          # (from any cause) FAIL LOUDLY instead of passing quietly.
          EXPECTED="$(awk '!/^#/ && NF>=2 && $2=="plain-shell" {print $1}' tests/ci-manifest | wc -l | tr -d ' ')"
          if [ "$EXPECTED" -eq 0 ]; then
            echo "ERROR: manifest lists 0 plain-shell tests — a loop that iterates nothing must not read as a clean pass."
            exit 1
          fi
          EXECUTED=0
          while IFS= read -r testfile; do
            EXECUTED=$((EXECUTED + 1))
            # Skip the runner-exit-propagation meta-test here — it runs first in
            # the dedicated step above so its runner-integrity gate fires before
            # the bulk suite is trusted. It stays enrolled in ci-manifest as
            # plain-shell for completeness; this guard prevents a double-run.
            if [ "$testfile" = "test-xaca-0653-runner-exit-propagation.sh" ]; then
              echo "SKIP (already run as dedicated pre-loop meta-test): ${testfile}"
              continue
            fi
            echo "─── Running: tests/${testfile} ───"
            if bash tests/test-runner.sh "tests/${testfile}" < /dev/null; then
              echo "PASS: ${testfile}"
            else
              echo "FAIL: ${testfile}"
              FAILED=$((FAILED + 1))
            fi
          done < <(awk '!/^#/ && NF>=2 && $2=="plain-shell" {print $1}' tests/ci-manifest)
          echo "plain-shell manifest entries executed: ${EXECUTED} of ${EXPECTED}"
          if [ "$EXECUTED" -ne "$EXPECTED" ]; then
            echo ""
            echo "ERROR: manifest drain — executed ${EXECUTED} of ${EXPECTED} plain-shell entries."
            echo "       The loop ended early; entries after #${EXECUTED} never ran."
            echo "       Usual cause: a test consuming this loop's stdin. Add '< /dev/null'."
            exit 1
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo ""
            echo "ERROR: ${FAILED} plain-shell test(s) failed."
            exit 1
          fi

      - name: Run brew-bash tests (manifest-driven, XACA-0707)
        # brew-bash category: tests that use `declare -A` (bash 4+) or other
        # bash-4-only syntax. Must be invoked via "$(brew --prefix)/bin/bash"
        # — macOS /bin/bash is 3.2. See XACA-0504.
        # The manifest-completeness-guard job ensures brew-bash entries stay in sync.
        run: |
          set -euo pipefail
          FAILED=0
          # XACA-0862: same stdin-drain hazard as the plain-shell loop above —
          # see the rationale there. Fixed identically so the two loops cannot
          # diverge on this property.
          EXPECTED="$(awk '!/^#/ && NF>=2 && $2=="brew-bash" {print $1}' tests/ci-manifest | wc -l | tr -d ' ')"
          if [ "$EXPECTED" -eq 0 ]; then
            echo "ERROR: manifest lists 0 brew-bash tests — a loop that iterates nothing must not read as a clean pass."
            exit 1
          fi
          EXECUTED=0
          while IFS= read -r testfile; do
            EXECUTED=$((EXECUTED + 1))
            echo "─── Running (brew-bash): tests/${testfile} ───"
            if "$(brew --prefix)/bin/bash" tests/test-runner.sh "tests/${testfile}" < /dev/null; then
              echo "PASS: ${testfile}"
            else
              echo "FAIL: ${testfile}"
              FAILED=$((FAILED + 1))
            fi
          done < <(awk '!/^#/ && NF>=2 && $2=="brew-bash" {print $1}' tests/ci-manifest)
          echo "brew-bash manifest entries executed: ${EXECUTED} of ${EXPECTED}"
          if [ "$EXECUTED" -ne "$EXPECTED" ]; then
            echo ""
            echo "ERROR: manifest drain — executed ${EXECUTED} of ${EXPECTED} brew-bash entries."
            echo "       The loop ended early; entries after #${EXECUTED} never ran."
            echo "       Usual cause: a test consuming this loop's stdin. Add '< /dev/null'."
            exit 1
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo ""
            echo "ERROR: ${FAILED} brew-bash test(s) failed."
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # E2E Fresh-Install Gate (XACA-0653)
  #
  # Real, non-mocked, full consumer-install journey on a clean runner: install
  # the formula from the local tap, then drive tests/test-xaca-0653-e2e-fresh-
  # install.sh, which provisions a throwaway team, starts the LCARS server, proves
  # durability (server survives launcher death), checks the resolver + doctor +
  # iterm2 import — all against the REAL installed binaries. Any failed step makes
  # the driver exit non-zero, which fails this job. This job is the release gate
  # consumed by kb-tap-release's E2E precondition.
  #
  # macos-14 only — matches test-formula (macos-13/Intel dropped in XACA-0499).
  # ─────────────────────────────────────────────────────────────────────────────
  e2e-fresh-install:
    # SIBLING-DRIFT COUPLING (XACA-0653): the `name:` below IS the check-run
    # name that scripts/kb-tap-release matches (E2E_GATE_CHECK_NAME). If you
    # rename this job, update kb-tap-release in lockstep or the release gate
    # silently blocks every release. See docs/homebrew-tap/TEST_PLAN.md Phase 8.
    name: E2E Fresh-Install Gate (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Caches/pip
          key: ${{ runner.os }}-homebrew-${{ hashFiles('Formula/aiteamforge.rb') }}
          restore-keys: |
            ${{ runner.os }}-homebrew-

      - name: Install formula dependencies
        run: |
          brew install python@3.13 node jq gh git

      - name: Tap local repository
        run: |
          mkdir -p $(brew --repository)/Library/Taps/doublenode
          ln -s $PWD $(brew --repository)/Library/Taps/doublenode/homebrew-aiteamforge

      - name: Install formula
        run: |
          brew install --build-from-source aiteamforge

      - name: Run E2E fresh-install gate
        # The driver self-isolates (sandboxed HOME + AITEAMFORGE_DIR) and contains
        # a dev-source guard that only refuses on a real dev-team checkout. On this
        # clean runner the install tree is the tap prefix, so the guard passes and
        # step 3 (kb-init-team) provisions a throwaway team. We invoke it through
        # the suite runner (consistent with the other shell suites); the runner
        # propagates the driver's exit code, so any failed step fails this job.
        run: |
          chmod +x tests/test-runner.sh tests/test-xaca-0653-e2e-fresh-install.sh
          bash tests/test-runner.sh tests/test-xaca-0653-e2e-fresh-install.sh

  # ─────────────────────────────────────────────────────────────────────────────
  # Node.js Test Suites — fleet-monitor/server/tests/
  # ─────────────────────────────────────────────────────────────────────────────
  test-node:
    name: Node.js Tests (${{ matrix.node-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: fleet-monitor/server/package-lock.json

      - name: Install fleet-monitor server dependencies
        working-directory: fleet-monitor/server
        run: |
          npm ci

      - name: Run fleet-monitor server tests
        # Tests use node:test (built-in, Node 18+) and supertest for HTTP assertions.
        # No real kanban board, tmux, or external services are needed — app-factory.js
        # creates isolated in-memory Express instances for each test.
        working-directory: fleet-monitor/server
        run: |
          npm test
