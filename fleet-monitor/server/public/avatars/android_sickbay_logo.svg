<?xml version="1.0" encoding="UTF-8"?>
<!-- Star Trek TOS - Sickbay Team Logo (Error Handling & Debugging) -->
<!-- Android Development Terminal - Sickbay Team -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#0066CC" stroke-width="3"/>
  
  <!-- Medical cross (Starfleet Medical insignia inspired) -->
  <!-- Vertical bar -->
  <rect x="92" y="55" width="16" height="90" fill="#0066CC"/>
  <!-- Horizontal bar -->
  <rect x="65" y="92" width="70" height="16" fill="#0066CC"/>
  
  <!-- Central medical circle -->
  <circle cx="100" cy="100" r="18" fill="none" stroke="#0066CC" stroke-width="3"/>
  <circle cx="100" cy="100" r="10" fill="#0066CC" opacity="0.3"/>
  
  <!-- Diagnostic scanner beams (radiating from center) -->
  <!-- Top beam -->
  <line x1="100" y1="82" x2="100" y2="30" stroke="#0066CC" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  <circle cx="100" cy="30" r="3" fill="#0066CC" opacity="0.6"/>
  
  <!-- Right beam -->
  <line x1="118" y1="100" x2="170" y2="100" stroke="#0066CC" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  <circle cx="170" cy="100" r="3" fill="#0066CC" opacity="0.6"/>
  
  <!-- Bottom beam -->
  <line x1="100" y1="118" x2="100" y2="170" stroke="#0066CC" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  <circle cx="100" cy="170" r="3" fill="#0066CC" opacity="0.6"/>
  
  <!-- Left beam -->
  <line x1="82" y1="100" x2="30" y2="100" stroke="#0066CC" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  <circle cx="30" cy="100" r="3" fill="#0066CC" opacity="0.6"/>
  
  <!-- Diagnostic readouts (corner panels) -->
  <!-- Top-left diagnostic panel -->
  <g transform="translate(35, 35)">
    <rect width="25" height="20" rx="2" fill="none" stroke="#0066CC" stroke-width="1.5"/>
    <line x1="3" y1="5" x2="22" y2="5" stroke="#0066CC" stroke-width="1"/>
    <line x1="3" y1="9" x2="18" y2="9" stroke="#0066CC" stroke-width="1"/>
    <line x1="3" y1="13" x2="20" y2="13" stroke="#0066CC" stroke-width="1"/>
  </g>
  
  <!-- Top-right diagnostic panel -->
  <g transform="translate(140, 35)">
    <rect width="25" height="20" rx="2" fill="none" stroke="#0066CC" stroke-width="1.5"/>
    <line x1="3" y1="5" x2="22" y2="5" stroke="#0066CC" stroke-width="1"/>
    <line x1="3" y1="9" x2="18" y2="9" stroke="#0066CC" stroke-width="1"/>
    <line x1="3" y1="13" x2="20" y2="13" stroke="#0066CC" stroke-width="1"/>
  </g>
  
  <!-- Bottom-left diagnostic panel -->
  <g transform="translate(35, 145)">
    <rect width="25" height="20" rx="2" fill="none" stroke="#0066CC" stroke-width="1.5"/>
    <line x1="3" y1="5" x2="22" y2="5" stroke="#0066CC" stroke-width="1"/>
    <line x1="3" y1="9" x2="18" y2="9" stroke="#0066CC" stroke-width="1"/>
    <line x1="3" y1="13" x2="20" y2="13" stroke="#0066CC" stroke-width="1"/>
  </g>
  
  <!-- Bottom-right diagnostic panel -->
  <g transform="translate(140, 145)">
    <rect width="25" height="20" rx="2" fill="none" stroke="#0066CC" stroke-width="1.5"/>
    <line x1="3" y1="5" x2="22" y2="5" stroke="#0066CC" stroke-width="1"/>
    <line x1="3" y1="9" x2="18" y2="9" stroke="#0066CC" stroke-width="1"/>
    <line x1="3" y1="13" x2="20" y2="13" stroke="#0066CC" stroke-width="1"/>
  </g>
  
  <!-- Heartbeat/activity monitor line (bottom) -->
  <path d="M 50 175 L 60 175 L 65 170 L 70 180 L 75 175 L 130 175 L 135 170 L 140 180 L 145 175 L 150 175" 
        fill="none" stroke="#0066CC" stroke-width="2" opacity="0.7"/>
  
  <!-- Medical tricorder indicators (small dots around cross arms) -->
  <circle cx="100" cy="60" r="2" fill="#0066CC" opacity="0.8"/>
  <circle cx="100" cy="140" r="2" fill="#0066CC" opacity="0.8"/>
  <circle cx="70" cy="100" r="2" fill="#0066CC" opacity="0.8"/>
  <circle cx="130" cy="100" r="2" fill="#0066CC" opacity="0.8"/>
</svg>
