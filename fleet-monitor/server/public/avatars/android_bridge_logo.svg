<?xml version="1.0" encoding="UTF-8"?>
<!-- Star Trek TOS - Bridge Team Logo (Command & Control) -->
<!-- Android Development Terminal - Bridge Team -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#FFD700" stroke-width="3"/>
  
  <!-- TOS Command star insignia (center) -->
  <path d="M 100 30 L 115 70 L 160 70 L 125 95 L 140 135 L 100 110 L 60 135 L 75 95 L 40 70 L 85 70 Z" 
        fill="#FFD700" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Circuit board elements (corners) -->
  <!-- Top left circuit -->
  <circle cx="50" cy="50" r="4" fill="#FFD700"/>
  <line x1="50" y1="50" x2="70" y2="50" stroke="#FFD700" stroke-width="2"/>
  <line x1="50" y1="50" x2="50" y2="70" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Top right circuit -->
  <circle cx="150" cy="50" r="4" fill="#FFD700"/>
  <line x1="150" y1="50" x2="130" y2="50" stroke="#FFD700" stroke-width="2"/>
  <line x1="150" y1="50" x2="150" y2="70" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Bottom left circuit -->
  <circle cx="50" cy="150" r="4" fill="#FFD700"/>
  <line x1="50" y1="150" x2="70" y2="150" stroke="#FFD700" stroke-width="2"/>
  <line x1="50" y1="150" x2="50" y2="130" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Bottom right circuit -->
  <circle cx="150" cy="150" r="4" fill="#FFD700"/>
  <line x1="150" y1="150" x2="130" y2="150" stroke="#FFD700" stroke-width="2"/>
  <line x1="150" y1="150" x2="150" y2="130" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Small connecting nodes -->
  <circle cx="70" cy="50" r="2" fill="#FFD700"/>
  <circle cx="130" cy="50" r="2" fill="#FFD700"/>
  <circle cx="70" cy="150" r="2" fill="#FFD700"/>
  <circle cx="130" cy="150" r="2" fill="#FFD700"/>
  
  <!-- Central Android symbol integration (subtle) -->
  <circle cx="100" cy="100" r="8" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.6"/>
</svg>
